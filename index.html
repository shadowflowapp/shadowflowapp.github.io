<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Situational Fluency Engine</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --surface-color: #1a1d24;
            --surface-hover: #2a2d35;
            --text-main: #ffffff;
            --text-sub: #8a919f;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            height: 100vh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column;
            padding: 20px 20px 40px 20px; box-sizing: border-box;
        }

        /* Top Bar: Word Hub */
        .word-header { text-align: center; margin-bottom: 20px; }
        .target-word { font-size: 36px; font-weight: 800; text-transform: lowercase; margin-bottom: 4px; letter-spacing: -1px; }
        .phonetic { font-size: 16px; color: var(--text-sub); font-family: monospace; margin-bottom: 10px; }
        
        .progress-badges { display: flex; justify-content: center; gap: 12px; }
        .progress-tracker { font-size: 13px; color: var(--text-sub); font-weight: 700; background: var(--surface-color); padding: 4px 10px; border-radius: 12px; }

        /* The Sentence Card */
        .card {
            background-color: var(--surface-color); border-radius: 24px; padding: 30px 24px;
            flex-grow: 1; display: flex; flex-direction: column; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;
        }

        .tags-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; width: 100%; position: absolute; top: 30px; left: 0; padding: 0 24px; box-sizing: border-box;
        }
        .situation-tag { background-color: rgba(245, 158, 11, 0.15); color: var(--accent-gold); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .pos-tag { font-size: 12px; font-weight: 600; color: var(--text-sub); }

        .english-sentence { font-size: 28px; font-weight: 600; line-height: 1.4; margin-bottom: 30px; text-align: center; }
        .target-highlight { color: var(--accent-blue); }

        /* Thai Reveal Bridge */
        .thai-bridge { text-align: center; margin-bottom: 20px; }
        .reveal-btn { background: none; border: 1px dashed #444; color: var(--text-sub); padding: 10px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .reveal-btn:active { background: #222; }
        .thai-text { display: none; font-size: 18px; color: var(--accent-gold); line-height: 1.5; font-weight: 500; }

        /* Controls */
        .controls { display: flex; gap: 12px; margin-top: 20px; }
        .btn { border: none; border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer; padding: 20px; flex: 1; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-audio { background-color: var(--surface-color); color: var(--text-main); border: 1px solid #333; flex: 0.5; }
        .btn-next { background-color: var(--accent-blue); color: #fff; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="word-header">
            <div class="target-word" id="target-word">loading</div>
            <div class="phonetic" id="phonetic"></div>
            <div class="progress-badges">
                <div class="progress-tracker">Word <span id="word-index">0</span> / <span id="total-words">0</span></div>
                <div class="progress-tracker">Card <span id="current-index">0</span> / <span id="total-index">0</span></div>
            </div>
        </div>

        <div class="card" id="card">
            <div class="tags-container">
                <div class="situation-tag" id="situation-tag">Loading...</div>
                <div class="pos-tag" id="pos-tag">Loading...</div>
            </div>

            <div class="english-sentence" id="english-sentence">Loading...</div>

            <div class="thai-bridge">
                <button class="reveal-btn" id="reveal-btn" onclick="revealThai()">Tap for Thai Context</button>
                <div class="thai-text" id="thai-text"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-audio" onclick="playAudio()">🔊 Listen</button>
            <button class="btn btn-next" onclick="nextSentence()">Next ➡️</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
