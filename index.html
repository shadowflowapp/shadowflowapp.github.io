<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrase Fluency Bubbles</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --primary-hover: #9965f4;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --success-color: #03dac6;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            margin-bottom: 40px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .stats { 
            font-size: 1rem; 
            color: var(--text-secondary); 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stats-number {
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: bold;
        }
        .card {
            background-color: var(--surface-color);
            border-radius: 20px;
            padding: 50px 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .bubble-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--primary-color);
            color: #121212;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9em;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .progress-indicator {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .english { 
            font-size: 1.6em; 
            margin-bottom: 20px; 
            line-height: 1.4; 
            font-weight: 600;
        }
        .highlight {
            color: var(--success-color);
            background-color: rgba(3, 218, 198, 0.15);
            padding: 2px 6px;
            border-radius: 6px;
        }
        .thai { 
            font-size: 1.2em; 
            color: var(--text-secondary); 
            margin-bottom: 40px; 
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        button {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.2s ease;
            flex: 1;
        }
        button:hover:not(:disabled) {
            background-color: rgba(187, 134, 252, 0.1);
            transform: translateY(-2px);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        button:disabled {
            color: #555;
            border-color: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .btn-play {
            background-color: var(--primary-color);
            color: var(--bg-color);
            flex: 1.5;
        }
        .btn-play:hover:not(:disabled) {
            background-color: var(--primary-hover);
            color: #fff;
        }
        #completion-msg {
            display: none;
            color: var(--success-color);
            margin-top: 25px;
            font-weight: bold;
            font-size: 1.1em;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="stats">
            <span class="stats-number" id="stat-sentences">0</span>
            <span>Sentences</span>
        </div>
        <div class="stats">
            <span class="stats-number" id="stat-bubbles">0</span>
            <span>Bubbles</span>
        </div>
    </div>

    <div class="card" id="card-container" style="display: none;">
        <div class="bubble-badge" id="bubble-name">Phrase</div>
        <div class="progress-indicator" id="progress-indicator">1 / 10</div>
        
        <div class="english" id="en-text">Loading...</div>
        <div class="thai" id="th-text">กำลังโหลด...</div>
        
        <div class="controls">
            <button id="btn-prev">Prev</button>
            <button id="btn-play" class="btn-play">🔊 Listen</button>
            <button id="btn-next">Next</button>
        </div>
        <div id="completion-msg">🎉 Bubble Completed! Loading next...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
