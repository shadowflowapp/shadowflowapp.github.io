<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dictionary Pronunciation App</title>
  <style>
    :root {
      /* Eye-friendly dark mode with Blue accents */
      --bg-outside: #09090b;
      --bg-app: #121214;
      --bg-surface: #1e1e24;
      --text-main: #e4e4e7;
      --text-muted: #a1a1aa;
      --accent: #3b82f6; /* Modern Blue */
      --highlight: #bfdbfe; /* Light Blue */
      --border: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-outside);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overscroll-behavior-y: none;
    }

    /* Mobile viewport enforcement on PC */
    #app-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 850px;
      background-color: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* A-Z Horizontal Scroll */
    #alphabet-nav {
      display: flex;
      overflow-x: auto;
      background: var(--bg-surface);
      padding: 12px 8px;
      border-bottom: 1px solid var(--border);
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
    }
    
    #alphabet-nav::-webkit-scrollbar { display: none; }
    
    .letter-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 8px 14px;
      margin: 0 4px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .letter-btn.active {
      color: #fff;
      background: var(--accent);
    }

    /* Main Content Area */
    #content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 24px;
      text-align: left;
      overflow-y: auto;
      touch-action: pan-y;
    }

    /* Word Header Layout */
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    #word-display {
      font-size: clamp(2rem, 8vw, 3rem); 
      font-weight: 700;
      letter-spacing: -0.02em;
      word-break: break-word;
      line-height: 1.1;
      color: #fff;
    }

    /* Meta: POS and IPA */
    .word-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    #pos-display {
      font-size: 0.95rem;
      color: var(--accent);
      font-style: italic;
      font-weight: 500;
    }

    #ipa-display {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif;
    }

    /* Sentence Layout */
    .sentence-container {
      background: var(--bg-surface);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      position: relative;
    }

    #sentence-display {
      font-size: 1.15rem;
      color: var(--text-main);
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .highlight {
      color: var(--highlight);
      font-weight: 600;
      border-bottom: 2px solid var(--accent);
    }

    /* Audio Buttons */
    .audio-btn {
      background: rgba(59, 130, 246, 0.1);
      color: var(--accent);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .audio-btn:hover { background: rgba(59, 130, 246, 0.2); }
    .audio-btn:active { transform: scale(0.92); }

    .sentence-audio-wrapper {
      display: flex;
      justify-content: flex-end;
    }

    /* Controls (Slider & Prev/Next) */
    #controls {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-app);
      flex-shrink: 0;
    }

    #slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    #word-slider {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 4px;
    }

    .slider-label { font-size: 0.85rem; color: var(--text-muted); width: 30px; text-align: center; }

    #nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-btn {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 12px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      flex: 1;
      transition: background 0.2s;
    }
    
    .nav-btn:hover:not(:disabled) { background: #2a2a30; }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="alphabet-nav"></div>

    <div id="content-area">
      <div class="word-header">
        <div id="word-display">Loading...</div>
        <button id="play-word-btn" class="audio-btn" aria-label="Play word">🔊</button>
      </div>
      
      <div class="word-meta">
        <span id="pos-display"></span>
        <span id="ipa-display"></span>
      </div>

      <div class="sentence-container">
        <div id="sentence-display">Please wait while the dictionary loads.</div>
        <div class="sentence-audio-wrapper">
          <button id="play-sentence-btn" class="audio-btn" aria-label="Play sentence">🔊</button>
        </div>
      </div>
    </div>

    <div id="controls">
      <div id="slider-container">
        <span class="slider-label" id="slider-current">1</span>
        <input type="range" id="word-slider" min="0" max="0" value="0">
        <span class="slider-label" id="slider-total">1</span>
      </div>
      <div id="nav-buttons">
        <button id="prev-btn" class="nav-btn">← Prev</button>
        <button id="next-btn" class="nav-btn">Next →</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
