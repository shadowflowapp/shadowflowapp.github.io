<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluency: AAA Injector</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Righteous&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        body { 
            background: #0b0c10; display: flex; justify-content: center; align-items: center; 
            height: 100dvh; overflow: hidden; touch-action: pan-y; color: #fff;
        }

        /* DAMAGE OVERLAY */
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 0px 0px rgba(255, 0, 60, 0);
            pointer-events: none; z-index: 99; transition: box-shadow 0.1s ease-out;
        }
        .taking-damage { box-shadow: inset 0 0 100px 30px rgba(255, 0, 60, 0.8) !important; background: rgba(255,0,60,0.15); }

        #app-container {
            width: 100%; max-width: 420px; height: 100dvh; max-height: 900px;
            background: linear-gradient(135deg, #1f2833 0%, #0b0c10 100%);
            display: flex; flex-direction: column; position: relative; 
            box-shadow: 0 0 40px rgba(102, 252, 241, 0.1); overflow: hidden;
        }

        /* SLEEK HUD HEADER */
        #top-bar { 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: 15px 20px 10px 20px; background: rgba(11, 12, 16, 0.8); backdrop-filter: blur(10px);
            border-bottom: 2px solid #66fcf1; z-index: 10; flex-shrink: 0; 
        }
        .hud-label { font-size: 0.8rem; color: #c5c6c7; letter-spacing: 2px; text-transform: uppercase; font-weight: 900; margin-bottom: 2px; }
        #xp-box { font-family: 'Righteous', cursive; font-size: 2.5rem; color: #66fcf1; text-shadow: 0 0 15px rgba(102, 252, 241, 0.6); line-height: 1; }
        
        #global-progress-bg { width: 100%; height: 4px; background: #1f2833; flex-shrink: 0; }
        #global-progress-fill { height: 100%; width: 0%; background: #ff007f; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px #ff007f; }

        /* INTEL / FLASHCARD DISPLAY */
        #flashcard { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 15px; text-align: center; width: 100%; overflow: hidden; }
        
        #pos-badge { background: #ff007f; color: #fff; padding: 2px 10px; border-radius: 8px; font-weight: 900; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 10px; }
        
        .text-fit-container { width: 100%; overflow: hidden; white-space: nowrap; display: flex; justify-content: center; align-items: center; }
        #word { font-family: 'Righteous', cursive; color: #fff; letter-spacing: 2px; line-height: 1.1; text-shadow: 3px 3px 0px #1f2833; text-transform: uppercase; }
        #ipa { font-size: 1.2rem; color: #66fcf1; font-family: 'Courier New', Courier, monospace; font-weight: 700; margin-bottom: 15px; }

        .def-box { background: rgba(0,0,0,0.4); padding: 15px; border-left: 3px solid #ff007f; border-radius: 8px; margin-bottom: 15px; width: 100%; }
        #definition { font-size: 1.1rem; color: #c5c6c7; font-weight: 700; line-height: 1.3; }

        .sentence-box { background: rgba(31, 40, 51, 0.8); padding: 15px; border-left: 3px solid #66fcf1; border-radius: 8px; width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; font-style: italic; }
        #sentence { font-size: 1.2rem; color: #fff; font-weight: 700; line-height: 1.4; }

        #audio-btn { 
            background: #66fcf1; color: #0b0c10; width: 60px; height: 60px; font-size: 2rem; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; 
            margin: 15px 0; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            flex-shrink: 0; border: none; border-radius: 50%; box-shadow: 0 5px 15px rgba(102, 252, 241, 0.3);
        }
        #audio-btn:active { transform: scale(0.9) translateY(5px); box-shadow: 0 2px 5px rgba(102, 252, 241, 0.2); }
        
        /* CONTROLS */
        #controls { display: flex; gap: 10px; padding: 15px; background: rgba(11,12,16,0.9); flex-shrink: 0; border-top: 1px solid #1f2833; }
        .nav-btn { 
            flex: 1; padding: 15px; font-size: 1.2rem; font-weight: 900; background: #1f2833; color: #c5c6c7; 
            border: none; border-radius: 10px; cursor: pointer; transition: 0.15s; letter-spacing: 1px;
            box-shadow: 0 4px 0 #0b0c10;
        }
        #back-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #0b0c10; }
        
        #next-btn { background: #66fcf1; color: #0b0c10; flex: 1.5; box-shadow: 0 4px 0 #45a29e; }
        #next-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #45a29e; }
        #next-btn.quiz-ready { background: #ff007f; color: #fff; box-shadow: 0 4px 0 #b30059; animation: pulse 1s infinite alternate; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.03); } }

        /* CLOZE GAUNTLET (Quiz) */
        #quiz-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0c10; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 15px 30px 15px; z-index: 20; overflow: hidden; }
        
        .timer-wrap { width: 100%; display: flex; justify-content: center; margin-top: 10px; }
        #timer-text { font-family: 'Righteous', cursive; font-size: clamp(2.5rem, 8vw, 4rem); color: #ff007f; line-height: 1; text-shadow: 0 0 15px rgba(255,0,127,0.5); white-space: nowrap; }
        
        .quiz-center-wrap { margin-top: 2vh; margin-bottom: auto; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
        
        /* The Cloze Sentence */
        #quiz-sentence { font-size: 1.4rem; color: #fff; font-weight: 700; line-height: 1.5; text-align: center; background: rgba(31, 40, 51, 0.5); padding: 20px; border-radius: 12px; border: 1px solid #1f2833; width: 100%; }
        
        .blank-space { color: #66fcf1; text-shadow: 0 0 10px rgba(102,252,241,0.5); border-bottom: 3px solid #ff007f; padding: 0 10px; display: inline-block; min-width: 100px; text-align: center; transition: 0.2s; }
        .blank-space.filled { color: #0b0c10; background: #66fcf1; border-bottom: none; border-radius: 5px; text-shadow: none; font-weight: 900; }

        #quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 15px; }
        .quiz-option { 
            padding: 20px 10px; font-size: clamp(1rem, 4.5vw, 1.3rem); font-weight: 900; color: #fff; 
            background: #1f2833; border: 2px solid #1f2833; border-radius: 12px; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; transition: 0.15s; text-align: center; line-height: 1.1; text-transform: uppercase;
            box-shadow: 0 5px 0 #0b0c10;
        }
        .quiz-option:active { transform: translateY(5px); box-shadow: 0 0px 0 #0b0c10; }
        .quiz-option.correct { background: #66fcf1 !important; color: #0b0c10; border-color: #66fcf1; box-shadow: 0 5px 0 #45a29e; }
        .quiz-option.wrong { background: #ff007f !important; color: #fff; border-color: #ff007f; box-shadow: 0 5px 0 #b30059; opacity: 0.5; pointer-events: none; }

        /* FLOATING XP PARTICLES */
        .xp-pop {
            position: absolute; font-family: 'Righteous', cursive; font-size: 2.2rem; color: #66fcf1;
            text-shadow: 0 0 15px rgba(102,252,241,0.8), 0px 4px 0px #000;
            pointer-events: none; z-index: 1000; transform: translate(-50%, -50%);
            animation: floatUp 1s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            30% { transform: translate(-50%, -120%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -250%) scale(1); }
        }

        /* MODAL */
        #custom-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,12,16,0.95); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.2s ease; }
        #custom-modal.show { opacity: 1; pointer-events: all; }
        .modal-content { background: #1f2833; border-radius: 20px; padding: 40px 20px; text-align: center; width: 85%; transform: scale(0.9); transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 2px solid #66fcf1; }
        #custom-modal.show .modal-content { transform: scale(1); }
        .modal-title { font-family: 'Righteous', cursive; font-size: 2.5rem; color: #66fcf1; margin-bottom: 10px; line-height: 1.1; }
        .modal-desc { font-size: 1.2rem; font-weight: 900; color: #c5c6c7; margin-bottom: 30px; }
        .modal-btn { background: #ff007f; color: #fff; font-family: 'Righteous', cursive; font-size: 1.5rem; padding: 15px 30px; border: none; border-radius: 12px; cursor: pointer; width: 100%; transition: 0.1s; box-shadow: 0 5px 0 #b30059; }
        .modal-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 #b30059; }
        
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0c10; display: flex; justify-content: center; align-items: center; z-index: 150; color: #66fcf1; font-family: 'Righteous', cursive; font-size: 3rem; }
    </style>
</head>
<body>

<div id="damage-overlay"></div>

<div id="app-container">
    <div id="loading-screen">LOADING...</div>

    <div id="top-bar">
        <span class="hud-label">OPERATIVE SCORE</span>
        <div id="xp-box">0</div>
    </div>
    <div id="global-progress-bg"><div id="global-progress-fill"></div></div>

    <div id="flashcard">
        <div id="pos-badge">...</div>
        <div class="text-fit-container" style="height: 5rem; margin-bottom: 0;">
            <div id="word">...</div>
        </div>
        <div id="ipa">...</div>
        
        <div class="def-box">
            <div id="definition">...</div>
        </div>
        
        <button id="audio-btn" onclick="playAudio()">▶</button>
        
        <div class="sentence-box">
            <div id="sentence">...</div>
        </div>
    </div>

    <!-- ENGAGEMENT ZONE (CLOZE QUIZ) -->
    <div id="quiz-container">
        <div class="timer-wrap">
            <div id="timer-text">30.0</div>
        </div>
        
        <div class="quiz-center-wrap">
            <div id="quiz-sentence">...</div>
        </div>
        
        <div id="quiz-options"></div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">...</div>
            <div class="modal-desc" id="modal-desc">...</div>
            <button class="modal-btn" onclick="closeModal()">CONTINUE</button>
        </div>
    </div>

    <div id="controls">
        <button id="back-btn" class="nav-btn" onclick="prevWord()">PREV</button>
        <button id="next-btn" class="nav-btn" onclick="nextWord()">NEXT</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
