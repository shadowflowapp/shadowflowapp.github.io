<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluency Ops: Tactical</title>
    <!-- Tactical AAA Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; }
        
        body { 
            background: #050505; display: flex; justify-content: center; align-items: center; 
            height: 100dvh; overflow: hidden; touch-action: pan-y; color: #e0e0e0;
        }

        /* Scanline Overlay */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* DAMAGE OVERLAY (CoD Blood Flash) */
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 100px 20px rgba(255, 0, 0, 0);
            pointer-events: none; z-index: 99; transition: box-shadow 0.1s ease-out;
        }
        .taking-damage { box-shadow: inset 0 0 150px 50px rgba(200, 0, 0, 0.8) !important; background: rgba(255,0,0,0.1); }

        #app-container {
            width: 100%; max-width: 420px; height: 100dvh; max-height: 900px;
            background: #0a0b0d; display: flex; flex-direction: column;
            position: relative; border: 2px solid #222; border-left: 4px solid #d4af37;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); overflow: hidden;
        }
        @media (max-width: 420px) { #app-container { border: none; border-left: 4px solid #d4af37; } }

        /* HUD HEADER */
        #top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; background: #111; border-bottom: 2px solid #333; z-index: 10; flex-shrink: 0; 
        }
        #xp-box { font-family: 'Black Ops One', cursive; font-size: 1.8rem; color: #d4af37; letter-spacing: 2px; }
        .hud-label { font-size: 0.8rem; color: #777; letter-spacing: 1px; display: block; }
        
        #global-progress-bg { width: 100%; height: 6px; background: #1a1a1a; flex-shrink: 0; }
        #global-progress-fill { height: 100%; width: 0%; background: #d4af37; transition: width 0.4s; box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }

        /* INTEL AREA (Flashcard) */
        #flashcard { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px 10px; text-align: center; width: 100%; overflow: hidden; background: radial-gradient(circle at center, #15181a 0%, #0a0b0d 100%); }
        
        #pos { background: #222; color: #aaa; padding: 4px 12px; border: 1px solid #444; font-weight: 700; font-size: 1rem; margin-bottom: 15px; letter-spacing: 2px; }
        
        .text-fit-container { width: 100%; overflow: hidden; white-space: nowrap; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        
        #word { font-family: 'Black Ops One', cursive; color: #fff; letter-spacing: 3px; line-height: 1.1; text-shadow: 2px 2px 0 #000; }
        #ipa { font-size: 1.2rem; font-weight: 700; margin-bottom: 25px; color: #666; font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }
        
        #audio-btn { 
            background: #d4af37; color: #000; width: 70px; height: 70px; font-size: 2rem; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; 
            margin-bottom: 30px; transition: 0.1s; flex-shrink: 0; border: none; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }
        #audio-btn:active { transform: scale(0.95); background: #fff; }
        
        #thai { color: #8bc34a; font-weight: 700; text-shadow: 2px 2px 0 #000; line-height: 1.1; letter-spacing: 1px; }
        
        /* TACTICAL CONTROLS */
        #controls { display: flex; gap: 10px; padding: 15px; background: #0a0b0d; flex-shrink: 0; border-top: 1px solid #222; }
        .nav-btn { 
            flex: 1; padding: 15px; font-size: 1.4rem; font-weight: 700; background: #1a1a1a; color: #888; 
            border: 1px solid #333; cursor: pointer; transition: 0.1s; font-family: 'Rajdhani', sans-serif; letter-spacing: 2px;
        }
        #back-btn:active { background: #333; color: #fff; }
        
        #next-btn { background: #222; color: #fff; border: 1px solid #444; flex: 1.5; border-right: 4px solid #d4af37; }
        #next-btn:active { background: #d4af37; color: #000; }
        #next-btn.quiz-ready { background: #5a0000; color: #fff; border-color: #ff0000; border-right: 4px solid #ff0000; }

        /* ENGAGEMENT ZONE (Gauntlet Quiz) */
        #quiz-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0a0b0d; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 15px 40px 15px; z-index: 20; overflow: hidden; }
        
        #timer-text { font-family: 'Black Ops One', cursive; font-size: 4rem; color: #fff; margin-top: 10px; line-height: 1; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
        
        .quiz-center-wrap { margin-top: 5vh; margin-bottom: auto; width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        #quiz-word { font-family: 'Black Ops One', cursive; color: #fff; display: inline-block; white-space: nowrap; line-height: 1; }
        #quiz-pos { font-size: 1.2rem; color: #888; background: #111; padding: 2px 10px; border: 1px solid #333; margin-top: 5px; }

        #quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: auto; }
        .quiz-option { 
            padding: 20px 10px; font-size: clamp(1rem, 4.5vw, 1.4rem); font-weight: 700; color: #ccc; 
            background: #111; border: 1px solid #333; cursor: pointer; display: flex; justify-content: center; 
            align-items: center; transition: 0.1s; text-align: center; word-wrap: break-word; line-height: 1.2;
            border-left: 3px solid #555;
        }
        .quiz-option:active { transform: scale(0.98); background: #222; }
        .quiz-option.correct { background: #1b3a1b !important; color: #8bc34a; border-color: #8bc34a; border-left: 5px solid #8bc34a; }
        .quiz-option.wrong { background: #3a0f0f !important; color: #ff4c4c; border-color: #ff4c4c; border-left: 5px solid #ff4c4c; opacity: 0.7; }

        /* AAR MODAL (After Action Report) */
        #custom-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; backdrop-filter: blur(5px); }
        #custom-modal.show { opacity: 1; pointer-events: all; }
        .modal-content { background: #111; border: 1px solid #444; border-top: 4px solid #d4af37; padding: 40px 20px; text-align: center; width: 85%; transform: scale(0.9); transition: transform 0.2s; box-shadow: 0 20px 50px rgba(0,0,0,1); }
        #custom-modal.show .modal-content { transform: scale(1); }
        .modal-title { font-family: 'Black Ops One', cursive; font-size: 2.5rem; color: #fff; margin-bottom: 10px; line-height: 1; }
        .modal-desc { font-size: 1.2rem; font-weight: 700; color: #aaa; margin-bottom: 30px; text-transform: none; }
        .modal-btn { background: #d4af37; color: #000; font-family: 'Black Ops One', cursive; font-size: 1.5rem; padding: 15px 30px; border: none; cursor: pointer; width: 100%; transition: 0.1s; }
        .modal-btn:active { background: #fff; }
        
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050505; display: flex; justify-content: center; align-items: center; z-index: 150; color: #d4af37; font-family: 'Black Ops One', cursive; font-size: 2rem; }
    </style>
</head>
<body>

<div id="damage-overlay"></div>

<div id="app-container">
    <div id="loading-screen">INITIALIZING...</div>

    <div id="top-bar">
        <div>
            <span class="hud-label">OPERATIVE XP</span>
            <div id="xp-box">00000</div>
        </div>
        <div style="text-align: right;">
            <span class="hud-label">DATABASE</span>
            <div style="color: #666; font-weight: 700; font-size: 1.2rem;" id="progress-text">0 / 0</div>
        </div>
    </div>
    <div id="global-progress-bg"><div id="global-progress-fill"></div></div>

    <div id="flashcard">
        <div id="pos">...</div>
        
        <div class="text-fit-container" style="height: 5.5rem;">
            <div id="word">...</div>
        </div>
        
        <div id="ipa">...</div>
        <button id="audio-btn" onclick="playAudio()">▶</button>
        
        <div class="text-fit-container" style="height: 4.5rem;">
            <div id="thai">...</div>
        </div>
    </div>

    <!-- ENGAGEMENT ZONE -->
    <div id="quiz-container">
        <div id="timer-text">30.0</div>
        
        <div class="quiz-center-wrap">
            <div class="text-fit-container" style="height: 5rem;">
                <div id="quiz-word">...</div>
            </div>
            <div id="quiz-pos">...</div>
        </div>
        
        <button id="audio-btn" style="margin-top: 15px;" onclick="playQuizAudio()">▶</button>
        <div id="quiz-options"></div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">...</div>
            <div class="modal-desc" id="modal-desc">...</div>
            <button class="modal-btn" onclick="closeModal()">ACKNOWLEDGE</button>
        </div>
    </div>

    <div id="controls">
        <button id="back-btn" class="nav-btn" onclick="prevWord()">[ PREV ]</button>
        <button id="next-btn" class="nav-btn" onclick="nextWord()">[ NEXT ]</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
