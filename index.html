<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10/10 CHALLENGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* High-energy Animations */
        .zoom-in { animation: zoomIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* Bold Status Colors */
        .correct-bg { background-color: #39ff14 !important; color: #000 !important; transform: scale(1.02); transition: all 0.2s; }
        .wrong-bg { background-color: #ff003c !important; color: #fff !important; }
        
        /* Neon Accents */
        .text-neon-yellow { color: #ccff00; }
        .bg-neon-blue { background-color: #00e5ff; color: #000; }
    </style>
</head>
<body class="text-white h-screen w-screen overflow-hidden flex flex-col select-none">

    <!-- Top Progress Bar -->
    <div id="top-bar" class="w-full flex justify-between items-center p-6 hidden absolute top-0 left-0 z-50">
        <div class="text-3xl font-black text-gray-700 tracking-tighter">X.APP</div>
        <div class="text-2xl font-black">
            <span class="text-gray-500">SCORE:</span> 
            <span id="global-progress" class="text-neon-yellow ml-2">0</span>
        </div>
    </div>

    <!-- START SCREEN (Bypasses Autoplay Policy) -->
    <div id="start-view" class="flex flex-col h-full w-full justify-center items-center p-6 bg-black z-40 absolute inset-0">
        <h1 class="text-6xl font-black text-center mb-4 leading-none uppercase">Master<br><span class="text-neon-yellow">The Words</span></h1>
        <p class="text-gray-400 text-xl font-bold text-center mb-12 uppercase">10/10 TO ADVANCE. NO MERCY.</p>
        <button onclick="startChallenge()" class="w-full max-w-sm py-6 bg-neon-blue rounded-xl text-3xl font-black shadow-lg active:scale-95 transition-transform uppercase">
            Start Challenge
        </button>
    </div>
    
    <!-- LEARNING VIEW -->
    <div id="learning-view" class="hidden flex-col h-full w-full justify-center items-center p-6 relative">
        <div class="flex-grow flex flex-col justify-center items-center w-full">
            <h1 id="en-word" class="text-[5rem] sm:text-[6rem] leading-none font-black text-neon-yellow uppercase tracking-tight text-center w-full truncate zoom-in"></h1>
            <p id="th-meaning" class="text-3xl sm:text-4xl text-white font-bold mt-6 text-center w-full px-4 zoom-in" style="animation-delay: 0.1s;"></p>
        </div>

        <button onclick="nextWord()" class="w-full max-w-md py-6 bg-white text-black rounded-xl text-3xl font-black shadow-lg active:scale-95 transition-transform uppercase mb-8">
            Next
        </button>
    </div>

    <!-- QUIZ VIEW (Vertical Choices) -->
    <div id="quiz-view" class="hidden flex-col h-full w-full justify-center p-6 relative max-w-md mx-auto">
        <div class="flex-grow flex flex-col justify-center space-y-8">
            <div class="text-center">
                <p id="quiz-th-target" class="text-4xl sm:text-5xl font-black text-white leading-tight zoom-in"></p>
            </div>

            <!-- Vertical Match Options -->
            <div id="quiz-options" class="flex flex-col w-full space-y-4 mt-8 zoom-in" style="animation-delay: 0.1s;">
                <!-- Buttons generated by JS -->
            </div>
        </div>
    </div>

    <!-- RESULT VIEW -->
    <div id="result-view" class="hidden flex-col h-full w-full justify-center items-center p-6 text-center">
        <h2 id="result-title" class="text-6xl font-black uppercase mb-4 leading-none"></h2>
        <p id="result-subtitle" class="text-2xl font-bold text-gray-400 mb-12 uppercase"></p>
        
        <div class="text-[7rem] font-black leading-none mb-12" id="final-score"></div>
        
        <button id="result-btn" class="w-full max-w-md py-6 rounded-xl text-3xl font-black shadow-lg active:scale-95 transition-transform uppercase mb-8">
            <!-- Text injected by JS -->
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
