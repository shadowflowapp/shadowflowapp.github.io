<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A-Z Dictionary Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #020202; 
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* AAA Mobile Frame Constraints for Desktop */
        #mobile-frame {
            width: 100vw;
            height: 100dvh;
            background-color: #050505;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }
        @media (min-width: 640px) {
            #mobile-frame {
                width: 430px;
                height: 850px;
                max-height: 90vh;
                border-radius: 40px;
                border: 8px solid #1a1a1c;
                margin-top: 5vh;
                box-shadow: 0 0 50px rgba(0, 229, 255, 0.05);
            }
        }

        /* Animations */
        .zoom-in { animation: zoomIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

        .shatter { animation: shatterAnim 0.6s ease-in forwards; }
        @keyframes shatterAnim { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(150px) rotate(10deg) scale(0.8); opacity: 0; } }
        
        /* Neon Colors */
        .text-neon-cyan { color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.6), 0 0 20px rgba(0,229,255,0.4); }
        .text-neon-yellow { color: #ccff00; text-shadow: 0 0 10px rgba(204,255,0,0.6), 0 0 20px rgba(204,255,0,0.4); }
        .text-neon-red { color: #ff003c; text-shadow: 0 0 10px rgba(255,0,60,0.8), 0 0 20px rgba(255,0,60,0.5); }
        .bg-neon-cyan { background-color: #00e5ff; color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.6); }
        
        /* Interactive Buttons */
        .correct-bg { background-color: #ccff00 !important; color: #000 !important; transform: scale(1.02); border-color: #ccff00 !important; box-shadow: 0 0 15px rgba(204,255,0,0.8); }
        .wrong-bg { background-color: #ff003c !important; color: #fff !important; border-color: #ff003c !important; box-shadow: 0 0 15px rgba(255,0,60,0.8); }
        
        /* Elimination Board Specific */
        .eliminated { opacity: 0.3; pointer-events: none; border-color: #00e5ff !important; color: #00e5ff !important; transform: scale(0.95); }

        /* AAA Segmented Round Progress Bar */
        .segment { transition: all 0.3s ease; height: 6px; border-radius: 9999px; flex: 1; }
        .seg-empty { background-color: #1a1a1c; }
        .seg-learn-filled { background-color: #ffffff; box-shadow: 0 0 5px rgba(255,255,255,0.8); }
        .seg-learn-active { background-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.8); animation: pulseBar 1s infinite alternate; }
        .seg-quiz-filled { background-color: #ccff00; box-shadow: 0 0 10px rgba(204,255,0,0.8); }
        .seg-quiz-active { background-color: #2a2a2c; border: 1px solid #ccff00; box-shadow: inset 0 0 5px rgba(204,255,0,0.5); animation: pulseBar 0.8s infinite alternate; }
        @keyframes pulseBar { from { opacity: 0.5; } to { opacity: 1; } }
        
        /* Unselectable A-Z Track */
        #az-track { scroll-behavior: smooth; }
        #az-track::-webkit-scrollbar { display: none; }
        .az-node { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .az-passed { color: #ffffff; font-size: 1rem; }
        .az-current { color: #00e5ff; font-size: 1.75rem; text-shadow: 0 0 10px rgba(0,229,255,0.8); }
        .az-future { color: #333333; font-size: 0.875rem; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen m-0 p-0 overflow-hidden">

    <div id="mobile-frame">
        
        <!-- HUD -->
        <div id="top-bar" class="w-full flex-col z-50 absolute top-0 left-0 bg-gradient-to-b from-[#050505] via-[#050505] to-transparent pb-6 hidden">
            <div class="relative w-full h-16 flex items-center justify-center overflow-hidden border-b border-gray-900/50">
                <div class="absolute w-full h-[2px] bg-gray-900 top-1/2 -translate-y-1/2 z-0"></div>
                <div id="az-track" class="flex items-center gap-6 overflow-x-hidden w-full px-[50%] absolute z-10 pointer-events-none">
                </div>
            </div>

            <div class="px-6 mt-4 flex flex-col gap-2">
                <div class="flex justify-between items-end">
                    <span id="round-display" class="text-xs font-black tracking-[0.2em] text-gray-500 uppercase">ROUND 1</span>
                    <span class="text-xs font-black tracking-widest text-gray-600">GLOBAL: <span id="global-progress" class="text-white">0</span></span>
                </div>
                <div id="progress-bar" class="flex w-full gap-1.5">
                </div>
            </div>
        </div>

        <!-- START SCREEN -->
        <div id="start-view" class="flex flex-col h-full w-full justify-center items-center p-6 bg-[#050505] z-40">
            <h1 class="text-5xl font-black text-center mb-4 leading-none uppercase">Master<br><span class="text-neon-cyan">A to Z</span></h1>
            <p class="text-gray-500 text-sm font-bold text-center mb-12 uppercase tracking-[0.2em] leading-relaxed">10 Words Per Round.<br>10/10 To Advance.<br>No Mercy.</p>
            
            <div id="start-error" class="hidden text-center bg-red-900/50 border border-red-500 rounded-lg p-4 mb-6 text-red-200 text-sm"></div>

            <button id="start-btn" onclick="startChallenge()" class="w-full mt-auto mb-10 py-6 bg-neon-cyan rounded-2xl text-2xl font-black active:scale-95 transition-transform uppercase hidden">
                Start Game
            </button>
        </div>
        
        <!-- LEARNING VIEW -->
        <div id="learning-view" class="hidden flex-col h-full w-full p-6 pt-40 relative">
            <div class="flex-grow flex flex-col justify-center items-center w-full">
                
                <div id="word-bounds" class="w-full relative flex flex-col justify-center items-center">
                    <h1 id="en-word" class="font-black text-neon-cyan lowercase tracking-tight leading-none whitespace-nowrap zoom-in"></h1>
                    <span id="pos-tag" class="text-gray-600 font-bold text-xl mt-3 lowercase zoom-in" style="animation-delay: 0.05s;"></span>
                </div>
                
                <div id="thai-bounds" class="w-full relative flex justify-center items-center mt-12 px-2">
                    <p id="th-meaning" class="text-white font-bold text-center whitespace-nowrap zoom-in" style="animation-delay: 0.1s;"></p>
                </div>
            </div>

            <button onclick="nextWord()" class="w-full py-5 mt-auto mb-6 bg-white text-black rounded-2xl text-xl font-black shadow-[0_0_20px_rgba(255,255,255,0.2)] active:scale-95 transition-transform uppercase">
                Next Word
            </button>
        </div>

        <!-- QUIZ VIEW (The Elimination Board) -->
        <div id="quiz-view" class="hidden flex-col h-full w-full p-6 pt-36 relative">
            
            <div class="flex flex-col justify-center w-full h-32 relative">
                <!-- Target Thai Meaning -->
                <div id="quiz-bounds" class="w-full relative flex justify-center items-center absolute inset-0">
                    <p id="quiz-th-target" class="font-black text-white text-center zoom-in drop-shadow-md whitespace-nowrap"></p>
                </div>
            </div>

            <!-- 10-Word Grid Options -->
            <div id="quiz-options" class="grid grid-cols-2 gap-3 mt-auto mb-6 w-full zoom-in" style="animation-delay: 0.1s;">
                <!-- Buttons generated dynamically -->
            </div>
        </div>

        <!-- RESULT VIEW -->
        <div id="result-view" class="hidden flex-col h-full w-full justify-center items-center p-6 text-center z-40 bg-[#050505] absolute inset-0">
            <h2 id="result-title" class="text-5xl font-black uppercase mb-2 leading-none mt-20"></h2>
            <p id="result-subtitle" class="text-sm font-bold text-gray-500 mb-10 uppercase tracking-[0.2em]"></p>
            
            <div class="text-[7rem] font-black leading-none mb-auto mt-10" id="final-score"></div>
            
            <button id="result-btn" class="w-full mt-auto mb-10 py-6 rounded-2xl text-2xl font-black active:scale-95 transition-transform uppercase">
            </button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
