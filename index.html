<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SwipeLingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-outer: #040508;
      --bg-shell: #0a0d14;
      --bg-surface: #121722;
      --bg-card: #151b28;
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #64748b;
      --green: #10b981;
      --red: #f43f5e;
      --gold: #f59e0b;
      --cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      background: var(--bg-outer);
      color: var(--text);
      height: 100dvh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .phone-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      background: var(--bg-shell);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 480px) {
      .phone-shell {
        width: 400px;
        height: min(92dvh, 820px);
        border-radius: 34px;
        border: 1px solid var(--border-strong);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.85);
      }
    }

    /* Particle FX Canvas */
    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    /* Minimal Top HUD */
    .hud {
      padding: 16px 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .cefr-pill {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(6, 182, 212, 0.14);
      border: 1px solid rgba(6, 182, 212, 0.35);
      color: #22d3ee;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .lvl-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .streak-pill {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.28);
      color: var(--gold);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.15s, border-color 0.2s;
    }

    .icon-btn:active { transform: scale(0.92); }

    .xp-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Arena */
    .arena {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
    }

    .card-mount {
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 470px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 26px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      touch-action: none;
      cursor: grab;
      will-change: transform;
      transition: box-shadow 0.25s, border-color 0.25s;
    }

    .card:active { cursor: grabbing; }

    .card.audio-mode {
      border-color: rgba(6, 182, 212, 0.35);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
    }

    .badge.audio {
      background: rgba(6, 182, 212, 0.14);
      color: #22d3ee;
    }

    /* Swipe Edge Glow Indicators (Minimalist replacement for big stamps) */
    .swipe-indicator {
      position: absolute;
      top: 22px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    .swipe-indicator.match {
      left: 22px;
      background: rgba(16, 185, 129, 0.18);
      color: var(--green);
      border: 2px solid var(--green);
    }

    .swipe-indicator.nope {
      right: 22px;
      background: rgba(244, 63, 94, 0.18);
      color: var(--red);
      border: 2px solid var(--red);
    }

    .en-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 10px 0;
    }

    .en-text {
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      word-break: break-word;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .audio-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .audio-btn:active { transform: scale(0.92); }

    .audio-btn.hero {
      width: 86px;
      height: 86px;
      font-size: 2rem;
      border: none;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      box-shadow: 0 12px 30px rgba(6, 182, 212, 0.35);
    }

    .audio-btn.slow {
      width: 38px;
      height: 38px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      width: 100%;
      background: var(--border);
    }

    .th-zone {
      padding: 20px 4px 8px;
      text-align: center;
    }

    .th-text {
      font-family: 'Noto Sans Thai', sans-serif;
      font-size: 1.38rem;
      font-weight: 500;
      line-height: 1.4;
      color: #e2e8f0;
    }

    /* Post-Swipe Review Overlay */
    .review-overlay {
      position: absolute;
      inset: 12px 20px;
      max-height: 470px;
      margin: auto;
      border-radius: 26px;
      background: rgba(15, 20, 31, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-strong);
      padding: 26px 24px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      z-index: 25;
      cursor: pointer;
    }

    .review-overlay.show {
      display: flex;
      animation: fadeIn 0.18s ease-out;
    }

    .review-overlay.correct { border-color: rgba(16, 185, 129, 0.55); }
    .review-overlay.wrong { border-color: rgba(244, 63, 94, 0.55); }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .review-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .review-overlay.correct .review-status { color: var(--green); }
    .review-overlay.wrong .review-status { color: var(--red); }

    .review-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .review-en {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }

    .review-th-correct {
      font-family: 'Noto Sans Thai', sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--green);
      line-height: 1.4;
    }

    .review-th-wrong {
      font-family: 'Noto Sans Thai', sans-serif;
      font-size: 0.95rem;
      color: var(--muted);
      text-decoration: line-through;
    }

    .review-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .next-btn {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: none;
      background: rgba(255, 255, 255, 0.09);
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .timer-bar {
      width: 100%;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--green);
      transform-origin: left;
    }

    /* Bottom Action Bar */
    .controls {
      padding: 12px 24px 26px;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
    }

    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1.5px solid;
      background: var(--bg-surface);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .action-btn:active { transform: scale(0.9); }
    .action-btn.nope { color: var(--red); border-color: rgba(244, 63, 94, 0.35); }
    .action-btn.match { color: var(--green); border-color: rgba(16, 185, 129, 0.35); }
    .action-btn.replay {
      width: 46px;
      height: 46px;
      font-size: 1.05rem;
      color: var(--cyan);
      border-color: rgba(6, 182, 212, 0.3);
    }

    /* Dashboard Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 5, 8, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .sheet {
      width: 100%;
      max-height: 85%;
      background: #0f141f;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border-top: 1px solid var(--border-strong);
      padding: 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-head h2 { font-size: 1.05rem; font-weight: 700; }

    .auth-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
    }

    .google-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      background: #ffffff;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .stat-box .label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-box .val {
      font-size: 1.3rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .mistakes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mistake-item {
      background: rgba(244, 63, 94, 0.07);
      border: 1px solid rgba(244, 63, 94, 0.2);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.84rem;
    }

    .mistake-item .en { font-weight: 700; color: #fff; }
    .mistake-item .th { font-family: 'Noto Sans Thai', sans-serif; color: var(--green); margin-top: 2px; }

    .reset-btn {
      padding: 11px;
      border-radius: 12px;
      border: 1px solid rgba(244, 63, 94, 0.35);
      background: transparent;
      color: #fda4af;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <canvas id="fxCanvas"></canvas>

    <!-- Minimal HUD -->
    <header class="hud">
      <div class="hud-row">
        <div class="hud-left" id="openDashboardBtn">
          <span class="cefr-pill" id="hudCefr">A1</span>
          <span class="lvl-text" id="hudLevel">LVL 1</span>
        </div>
        <div class="hud-right">
          <div class="streak-pill" id="hudStreak">🔥 0</div>
          <button class="icon-btn" id="soundToggleBtn" aria-label="SFX">🔊</button>
          <button class="icon-btn" id="statsBtn" aria-label="Profile">☰</button>
        </div>
      </div>
      <div class="xp-track">
        <div class="xp-fill" id="xpFill"></div>
      </div>
    </header>

    <!-- Card Arena -->
    <main class="arena">
      <div class="card-mount" id="cardMount"></div>

      <!-- Post-Swipe Review Overlay -->
      <div class="review-overlay" id="reviewOverlay">
        <div class="review-status" id="reviewStatus"></div>
        <div class="review-body">
          <div class="review-en" id="reviewEn"></div>
          <button class="audio-btn" id="reviewAudioBtn" aria-label="Play audio">🔊</button>
          <div class="review-th-correct" id="reviewThCorrect"></div>
          <div class="review-th-wrong" id="reviewThWrong"></div>
        </div>
        <div class="review-footer">
          <div class="timer-bar" id="reviewTimerBar"><div class="timer-fill" id="reviewTimerFill"></div></div>
          <button class="next-btn" id="reviewNextBtn">Continue</button>
        </div>
      </div>
    </main>

    <!-- Controls -->
    <footer class="controls">
      <button class="action-btn nope" id="btnNope" aria-label="Wrong">✕</button>
      <button class="action-btn replay" id="btnReplay" aria-label="Listen">🔊</button>
      <button class="action-btn match" id="btnMatch" aria-label="Match">✓</button>
    </footer>

    <!-- Dashboard & Auth Sheet -->
    <div class="modal-backdrop" id="dashboardModal">
      <div class="sheet">
        <div class="sheet-head">
          <h2>Profile</h2>
          <button class="icon-btn" id="closeDashboardBtn">✕</button>
        </div>

        <div class="auth-card">
          <div>
            <div style="font-size:0.88rem; font-weight:700;" id="authUserLabel">Guest</div>
            <div style="font-size:0.72rem; color:var(--muted);" id="authSubLabel">Local storage mode</div>
          </div>
          <button class="google-btn" id="googleAuthBtn">Sign in with Google</button>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="label">CEFR Rating</div>
            <div class="val" id="statCefr" style="color: var(--cyan);">A1 (1.5)</div>
          </div>
          <div class="stat-box">
            <div class="label">Total XP</div>
            <div class="val" id="statXp" style="color: var(--gold);">0</div>
          </div>
          <div class="stat-box">
            <div class="label">Accuracy</div>
            <div class="val" id="statAcc" style="color: var(--green);">0%</div>
          </div>
          <div class="stat-box">
            <div class="label">Best Streak</div>
            <div class="val" id="statBestStreak" style="color: #fb923c;">0</div>
          </div>
        </div>

        <div class="mistakes-list" id="mistakesList"></div>
        <button class="reset-btn" id="resetBtn">Reset Progress</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
