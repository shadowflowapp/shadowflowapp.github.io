<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Situational Fluency Engine</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --surface-color: #1a1d24;
            --surface-hover: #2a2d35;
            --text-main: #ffffff;
            --text-sub: #8a919f;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --correct-color: #2eab5b;
            --wrong-color: #e53e3e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            height: 100vh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column;
            padding: 20px 20px 40px 20px; box-sizing: border-box;
        }

        /* Top Bar */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .mastery-badge { font-size: 14px; font-weight: 700; background: var(--surface-color); padding: 8px 16px; border-radius: 20px; color: var(--accent-gold); }
        .progress-tracker { font-size: 13px; color: var(--text-sub); font-weight: 700; }

        .target-word-title { font-size: 32px; font-weight: 800; text-transform: lowercase; text-align: center; margin-bottom: 20px; letter-spacing: -1px; }

        /* Container Toggles */
        #study-container, #quiz-container { display: flex; flex-direction: column; flex-grow: 1; }
        #quiz-container { display: none; } /* Hidden initially */

        /* ---------------- STUDY UI ---------------- */
        .card {
            background-color: var(--surface-color); border-radius: 24px; padding: 30px 24px;
            flex-grow: 1; display: flex; flex-direction: column; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;
        }

        .tags-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; width: 100%; position: absolute; top: 30px; left: 0; padding: 0 24px; box-sizing: border-box;
        }
        .situation-tag { background-color: rgba(59, 130, 246, 0.15); color: var(--accent-blue); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .pos-tag { font-size: 12px; font-weight: 600; color: var(--text-sub); }

        .english-sentence { font-size: 28px; font-weight: 600; line-height: 1.4; margin-bottom: 30px; text-align: center; }
        .target-highlight { color: var(--accent-gold); }

        .thai-bridge { text-align: center; margin-bottom: 20px; }
        .reveal-btn { background: none; border: 1px dashed #444; color: var(--text-sub); padding: 10px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        .thai-text { display: none; font-size: 18px; color: var(--text-main); line-height: 1.5; font-weight: 500; }

        .controls { display: flex; gap: 12px; margin-top: 20px; }
        .btn { border: none; border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer; padding: 20px; flex: 1; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-audio { background-color: var(--surface-color); color: var(--text-main); border: 1px solid #333; flex: 0.5; }
        .btn-next { background-color: var(--text-main); color: var(--bg-color); }
        .btn-quiz { background-color: var(--accent-gold); color: #000; display: none; }

        /* ---------------- QUIZ UI ---------------- */
        .quiz-header { font-size: 14px; color: var(--accent-gold); font-weight: 700; text-transform: uppercase; text-align: center; margin-bottom: 10px; letter-spacing: 1px; }
        .blank { display: inline-block; min-width: 80px; border-bottom: 2px solid var(--text-sub); color: transparent; text-align: center; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 20px; margin-top: 20px; }
        .option-btn { background-color: var(--surface-color); color: var(--text-main); border: 2px solid transparent; padding: 20px 10px; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.1s ease; }
        .option-btn.correct { background-color: var(--correct-color); border-color: var(--correct-color); }
        .option-btn.wrong { background-color: var(--wrong-color); border-color: var(--wrong-color); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header">
            <div class="progress-tracker">Word <span id="word-index">0</span> / <span id="total-words">0</span></div>
            <div class="mastery-badge">⭐️ Mastered: <span id="mastered-count">0</span></div>
        </div>

        <div class="target-word-title" id="target-word">loading</div>

        <!-- STUDY INTERFACE -->
        <div id="study-container">
            <div class="card">
                <div class="tags-container">
                    <div class="situation-tag" id="situation-tag">Loading...</div>
                    <div class="pos-tag" id="pos-tag">Loading...</div>
                </div>

                <div class="english-sentence" id="english-sentence">Loading...</div>

                <div class="thai-bridge">
                    <button class="reveal-btn" id="reveal-btn" onclick="revealThai()">Tap for Thai Context</button>
                    <div class="thai-text" id="thai-text"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-audio" onclick="playAudio()">🔊</button>
                <button class="btn btn-next" id="btn-next" onclick="nextSentence()">Next ➡️</button>
                <button class="btn btn-quiz" id="btn-quiz" onclick="startQuiz()">Take Quiz ⚔️</button>
            </div>
        </div>

        <!-- QUIZ INTERFACE -->
        <div id="quiz-container">
            <div class="card">
                <div class="quiz-header">Mastery Check</div>
                <div class="tags-container" style="top: 50px;">
                    <div class="situation-tag" id="quiz-situation">Loading...</div>
                </div>
                <div class="english-sentence" id="quiz-sentence" style="margin-top: 40px;">Loading...</div>
            </div>

            <div class="options-grid" id="options-grid"></div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
