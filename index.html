<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Nexus: Physics</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050a0e;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff003c;
            --neon-yellow: #fcee0a;
            --dark-panel: #111820;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER & HUD */
        .hud {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            background: linear-gradient(180deg, rgba(0,240,255,0.1) 0%, transparent 100%);
        }

        .hud-item {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .xp-bar-container {
            width: 100px;
            height: 10px;
            background: #222;
            border: 1px solid var(--neon-cyan);
            margin-top: 5px;
        }

        .xp-bar {
            height: 100%;
            width: 0%;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
            transition: width 0.3s ease;
        }

        /* MAIN TERMINAL */
        .terminal {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-card {
            background: var(--dark-panel);
            border: 1px solid #333;
            border-left: 4px solid var(--neon-pink);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .topic-tag {
            position: absolute;
            top: -12px;
            left: 10px;
            background: var(--neon-pink);
            color: #000;
            padding: 2px 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 900;
        }

        .question-text {
            font-size: 1.4rem;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .thai-text {
            color: var(--neon-yellow);
            font-size: 1.2rem;
            display: none; /* Hidden by default */
            margin-top: 10px;
            border-top: 1px dashed #555;
            padding-top: 10px;
        }

        /* DECRYPTION BUTTON */
        .decrypt-btn {
            background: transparent;
            border: 1px solid var(--neon-yellow);
            color: var(--neon-yellow);
            padding: 8px 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            text-transform: uppercase;
        }
        
        .decrypt-btn:active {
            background: rgba(252, 238, 10, 0.2);
        }

        /* CHOICES */
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .choice-btn {
            background: var(--dark-panel);
            border: 1px solid #444;
            color: #fff;
            padding: 15px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .choice-btn:active {
            transform: scale(0.98);
        }

        .choice-btn.correct {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
            box-shadow: inset 0 0 10px var(--neon-cyan);
        }

        .choice-btn.wrong {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 60, 0.1);
            box-shadow: inset 0 0 10px var(--neon-pink);
        }

        .choice-th {
            display: none;
            color: #aaa;
            font-size: 1rem;
            margin-top: 5px;
        }

        #next-btn {
            display: none;
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            background: var(--neon-cyan);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <div class="hud">
        <div>
            <div class="hud-item" id="level-display">Lvl 1: Script Kiddie</div>
        </div>
        <div style="text-align: right;">
            <div class="hud-item" id="xp-display">0 XP</div>
            <div class="xp-bar-container">
                <div class="xp-bar" id="xp-bar"></div>
            </div>
        </div>
    </div>

    <div class="terminal" id="terminal">
        <div class="question-card">
            <div class="topic-tag" id="topic-tag">TOPIC</div>
            <div class="question-text" id="question-text">Loading Node Data...</div>
            <div class="thai-text" id="thai-text"></div>
        </div>

        <button class="decrypt-btn" id="decrypt-btn" onclick="decryptProtocol()">
            <span>[Run Decryption Protocol]</span>
            <span id="penalty-text">Cost: -50% XP</span>
        </button>

        <div class="choices-grid" id="choices-grid">
            <!-- Choices generated via JS -->
        </div>

        <button id="next-btn" onclick="nextQuestion()">INITIALIZE NEXT NODE >></button>
    </div>

    <script src="app.js"></script>
</body>
</html>
