<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10/10 CHALLENGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .zoom-in { animation: zoomIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        .correct-bg { background-color: #39ff14 !important; color: #000 !important; transform: scale(1.02); transition: all 0.2s; border: 2px solid #39ff14; }
        .wrong-bg { background-color: #ff003c !important; color: #fff !important; border: 2px solid #ff003c; }
        
        .text-neon-yellow { color: #ccff00; }
        .bg-neon-blue { background-color: #00e5ff; color: #000; }
    </style>
</head>
<body class="text-white min-h-screen bg-black flex flex-col select-none overflow-x-hidden">

    <!-- Top Progress Bar -->
    <div id="top-bar" class="w-full flex justify-between items-center p-6 hidden">
        <div class="text-2xl sm:text-3xl font-black text-gray-700 tracking-tighter">X.APP</div>
        <div class="text-xl sm:text-2xl font-black">
            <span class="text-gray-500 hidden sm:inline">SCORE:</span> 
            <span id="global-progress" class="text-neon-yellow">0</span>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-view" class="flex flex-col flex-grow w-full justify-center items-center p-6 bg-black z-40 fixed inset-0">
        <h1 class="text-5xl sm:text-7xl font-black text-center mb-4 leading-none uppercase">Master<br><span class="text-neon-yellow">The Words</span></h1>
        <p class="text-gray-400 text-lg sm:text-xl font-bold text-center mb-12 uppercase">10/10 TO ADVANCE. NO MERCY.</p>
        <button onclick="startChallenge()" class="w-full max-w-sm py-6 bg-neon-blue rounded-xl text-3xl font-black shadow-lg active:scale-95 transition-transform uppercase">
            Start Challenge
        </button>
    </div>
    
    <!-- LEARNING VIEW -->
    <div id="learning-view" class="hidden flex-col flex-grow w-full justify-center items-center p-6 max-w-3xl mx-auto">
        <div class="flex-grow flex flex-col justify-center items-center w-full my-8">
            
            <!-- Strict container for measuring English Word -->
            <div id="word-bounds" class="w-full relative flex flex-col justify-center items-center">
                <!-- English Word -->
                <h1 id="en-word" class="font-black text-neon-yellow uppercase tracking-tight leading-none whitespace-nowrap zoom-in"></h1>
                <!-- Part of Speech (Beneath) -->
                <span id="pos-tag" class="text-gray-500 font-bold text-2xl sm:text-3xl mt-4 lowercase zoom-in" style="animation-delay: 0.05s;"></span>
            </div>
            
            <!-- Strict container for measuring Thai Meaning -->
            <div id="thai-bounds" class="w-full relative flex justify-center items-center mt-8">
                <p id="th-meaning" class="text-white font-bold whitespace-nowrap zoom-in text-center" style="animation-delay: 0.1s;"></p>
            </div>
            
        </div>

        <button onclick="nextWord()" class="w-full max-w-md py-6 bg-white text-black rounded-xl text-3xl font-black shadow-lg active:scale-95 transition-transform uppercase mb-8">
            Next
        </button>
    </div>

    <!-- QUIZ VIEW -->
    <div id="quiz-view" class="hidden flex-col flex-grow w-full justify-center items-center p-6 max-w-md mx-auto my-8">
        
        <div id="quiz-bounds" class="w-full relative flex justify-center items-center">
            <p id="quiz-th-target" class="font-black text-white whitespace-nowrap zoom-in text-center"></p>
        </div>

        <!-- Options Container -->
        <div id="quiz-options" class="flex flex-col w-full space-y-4 mt-12 zoom-in" style="animation-delay: 0.1s;">
            <!-- Buttons generated dynamically -->
        </div>
    </div>

    <!-- RESULT VIEW -->
    <div id="result-view" class="hidden flex-col flex-grow w-full justify-center items-center p-6 text-center">
        <h2 id="result-title" class="text-5xl sm:text-7xl font-black uppercase mb-4 leading-none"></h2>
        <p id="result-subtitle" class="text-xl sm:text-3xl font-bold text-gray-400 mb-12 uppercase"></p>
        
        <div class="text-[6rem] sm:text-[9rem] font-black leading-none mb-12" id="final-score"></div>
        
        <button id="result-btn" class="w-full max-w-md py-6 rounded-xl text-2xl sm:text-3xl font-black shadow-lg active:scale-95 transition-transform uppercase mb-8">
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
