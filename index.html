<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE PHYSICS CHALLENGE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap');

        :root {
            --mb-cyan: #00e5ff;
            --mb-pink: #ff007f;
            --mb-yellow: #ffea00;
            --mb-dark: #121212;
            --mb-white: #ffffff;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #0a0a2a;
            background-image: radial-gradient(circle at 50% 0%, #1a1a4a 0%, #0a0a2a 100%);
            color: var(--mb-white);
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
            position: relative; z-index: 10;
        }

        /* Top HUD */
        .hud-header {
            background: var(--mb-dark); border: 4px solid var(--mb-cyan);
            border-radius: 16px; padding: 10px 15px; margin-bottom: 15px;
            display: flex; flex-direction: column; gap: 5px;
            box-shadow: 0 8px 0 #0096a6;
        }
        .hud-top-row { display: flex; justify-content: space-between; align-items: center; }
        .xp-title { font-family: 'Lilita One', cursive; font-size: 28px; color: var(--mb-yellow); text-shadow: 2px 2px 0 #000; margin: 0; }
        .streak-text { color: var(--mb-pink); font-weight: 900; font-size: 16px; text-transform: uppercase; }
        .lives-container { font-size: 24px; letter-spacing: 2px; }

        /* Objective Panel */
        .objective-panel {
            background: var(--mb-white); color: var(--mb-dark);
            border-radius: 16px; padding: 20px; border: 4px solid var(--mb-dark);
            box-shadow: 0 8px 0 var(--mb-dark);
            margin-bottom: 20px; position: relative; text-align: center;
        }
        .question-text { font-family: 'Lilita One', cursive; font-size: 24px; line-height: 1.2; min-height: 80px; display: flex; align-items: center; justify-content: center;}
        
        .translate-btn {
            background: var(--mb-pink); color: #fff; border: 3px solid var(--mb-dark);
            font-family: 'Lilita One', cursive; padding: 5px 15px; font-size: 14px;
            cursor: pointer; border-radius: 20px; margin-bottom: 10px;
            box-shadow: 0 4px 0 var(--mb-dark); transition: transform 0.1s;
        }
        .translate-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--mb-dark); }

        /* 3x3 Keypad Grid */
        .keypad-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        
        .option-btn {
            aspect-ratio: 1 / 0.8; background: var(--mb-yellow); border: 4px solid var(--mb-dark);
            color: var(--mb-dark); font-family: 'Lilita One', cursive; font-size: 32px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; box-shadow: 0 6px 0 var(--mb-dark); transition: all 0.1s;
        }
        .option-btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--mb-dark); }
        .option-btn.correct { background: var(--mb-cyan); color: #000; }
        .option-btn.wrong { background: var(--mb-pink); color: #fff; opacity: 0.7;}

        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); text-align: center;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .title-huge { font-family: 'Lilita One', cursive; font-size: 50px; text-transform: uppercase; margin-bottom: 10px; text-shadow: 4px 4px 0 #000; }
        .text-cyan { color: var(--mb-cyan); }
        .text-pink { color: var(--mb-pink); }
        
        .xp-popup { font-size: 30px; font-weight: 900; color: var(--mb-yellow); margin-bottom: 20px;}

        .action-btn {
            margin-top: 20px; background: var(--mb-yellow); border: 4px solid var(--mb-dark); color: var(--mb-dark);
            font-family: 'Lilita One', cursive; font-size: 24px; padding: 15px 40px; border-radius: 20px;
            cursor: pointer; text-transform: uppercase; box-shadow: 0 6px 0 var(--mb-dark);
        }
        .action-btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--mb-dark); }

    </style>
</head>
<body>

    <div class="app-container" id="main-container">
        
        <!-- Top HUD -->
        <div class="hud-header">
            <div class="hud-top-row">
                <h1 class="xp-title"><span id="total-xp">0</span> XP</h1>
                <div class="lives-container" id="lives-display">❤️❤️❤️</div>
            </div>
            <div class="streak-text">Streak Multiplier: <span id="streak-mult">1.0x</span></div>
        </div>

        <!-- Objective Panel -->
        <div class="objective-panel">
            <button class="translate-btn" id="translate-btn" onclick="toggleLanguage()">SHOW THAI TRANSLATION</button>
            <div class="question-text" id="question-text">Loading Challenge...</div>
        </div>

        <!-- 3x3 Keypad -->
        <div class="keypad-container">
            <div class="options-grid" id="options-grid"></div>
        </div>

        <!-- Correct Overlay -->
        <div class="overlay" id="overlay-correct">
            <div class="title-huge text-cyan">AWESOME!</div>
            <div class="xp-popup" id="earned-xp-text">+1000 XP</div>
        </div>

        <!-- Eliminated Overlay -->
        <div class="overlay" id="overlay-eliminated">
            <div class="title-huge text-pink">ELIMINATED!</div>
            <div style="color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 20px;">You lost all your chances!</div>
            <button class="action-btn" onclick="restartChallenge()">TRY AGAIN</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
