<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluency: Arcade</title>
    <!-- AAA Fonts: Righteous for headers, Nunito for flawless Thai display -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Righteous&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        body { 
            background: #0b0c10; display: flex; justify-content: center; align-items: center; 
            height: 100dvh; overflow: hidden; touch-action: pan-y; color: #fff;
        }

        /* DAMAGE OVERLAY */
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 0px 0px rgba(255, 0, 60, 0);
            pointer-events: none; z-index: 99; transition: box-shadow 0.1s ease-out;
        }
        .taking-damage { box-shadow: inset 0 0 100px 30px rgba(255, 0, 60, 0.8) !important; background: rgba(255,0,60,0.15); }

        #app-container {
            width: 100%; max-width: 420px; height: 100dvh; max-height: 900px;
            background: linear-gradient(135deg, #1f2833 0%, #0b0c10 100%);
            display: flex; flex-direction: column; position: relative; 
            box-shadow: 0 0 40px rgba(102, 252, 241, 0.1); overflow: hidden;
        }

        /* SLEEK HUD HEADER */
        #top-bar { 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: 20px 20px 15px 20px; background: rgba(11, 12, 16, 0.8); backdrop-filter: blur(10px);
            border-bottom: 2px solid #66fcf1; z-index: 10; flex-shrink: 0; 
        }
        .hud-label { font-size: 0.9rem; color: #c5c6c7; letter-spacing: 2px; text-transform: uppercase; font-weight: 900; margin-bottom: 5px; }
        #xp-box { 
            font-family: 'Righteous', cursive; font-size: 3rem; color: #66fcf1; 
            text-shadow: 0 0 15px rgba(102, 252, 241, 0.6); line-height: 1; 
        }
        
        #global-progress-bg { width: 100%; height: 4px; background: #1f2833; flex-shrink: 0; }
        #global-progress-fill { height: 100%; width: 0%; background: #ff007f; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px #ff007f; }

        /* FLASHCARD DISPLAY */
        #flashcard { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px 15px; text-align: center; width: 100%; overflow: hidden; }
        
        .text-fit-container { width: 100%; overflow: hidden; white-space: nowrap; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        
        #word { font-family: 'Righteous', cursive; color: #fff; letter-spacing: 2px; line-height: 1.2; text-shadow: 3px 3px 0px #1f2833; text-transform: uppercase; }
        
        #audio-btn { 
            background: #66fcf1; color: #0b0c10; width: 80px; height: 80px; font-size: 2.5rem; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; 
            margin: 20px 0 30px 0; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            flex-shrink: 0; border: none; border-radius: 50%; box-shadow: 0 10px 20px rgba(102, 252, 241, 0.3);
        }
        #audio-btn:active { transform: scale(0.9) translateY(5px); box-shadow: 0 5px 10px rgba(102, 252, 241, 0.2); }
        
        /* Flawless Thai Text rendering */
        #thai { color: #ff007f; font-weight: 900; text-shadow: 2px 2px 0px #1f2833; line-height: 1.4; padding-bottom: 10px; }
        
        /* CONTROLS */
        #controls { display: flex; gap: 15px; padding: 20px; background: rgba(11,12,16,0.9); flex-shrink: 0; border-top: 1px solid #1f2833; }
        .nav-btn { 
            flex: 1; padding: 18px; font-size: 1.4rem; font-weight: 900; background: #1f2833; color: #c5c6c7; 
            border: none; border-radius: 12px; cursor: pointer; transition: 0.15s; letter-spacing: 1px;
            box-shadow: 0 5px 0 #0b0c10;
        }
        #back-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 #0b0c10; }
        
        #next-btn { background: #66fcf1; color: #0b0c10; flex: 1.5; box-shadow: 0 5px 0 #45a29e; }
        #next-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 #45a29e; }
        #next-btn.quiz-ready { background: #ff007f; color: #fff; box-shadow: 0 5px 0 #b30059; animation: pulse 1s infinite alternate; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.03); } }

        /* ENGAGEMENT ZONE (Gauntlet Quiz) */
        #quiz-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0c10; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 15px 40px 15px; z-index: 20; overflow: hidden; }
        
        /* Fixed Timer constraints so it never cuts */
        .timer-wrap { width: 100%; display: flex; justify-content: center; height: 5rem; margin-top: 20px; }
        #timer-text { font-family: 'Righteous', cursive; font-size: clamp(3rem, 10vw, 4.5rem); color: #ff007f; line-height: 1; text-shadow: 0 0 20px rgba(255,0,127,0.5); white-space: nowrap; }
        
        .quiz-center-wrap { margin-top: 8vh; margin-bottom: auto; width: 100%; display: flex; flex-direction: column; align-items: center; }
        #quiz-word { font-family: 'Righteous', cursive; color: #fff; display: inline-block; white-space: nowrap; line-height: 1.2; text-transform: uppercase; }

        #quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: auto; }
        .quiz-option { 
            padding: 20px 10px; font-size: clamp(1.1rem, 4.5vw, 1.4rem); font-weight: 900; color: #fff; 
            background: #1f2833; border: 2px solid #1f2833; border-radius: 15px; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; transition: 0.15s; text-align: center; line-height: 1.3;
            box-shadow: 0 5px 0 #0b0c10;
        }
        .quiz-option:active { transform: translateY(5px); box-shadow: 0 0px 0 #0b0c10; }
        .quiz-option.correct { background: #66fcf1 !important; color: #0b0c10; border-color: #66fcf1; box-shadow: 0 5px 0 #45a29e; }
        .quiz-option.wrong { background: #ff007f !important; color: #fff; border-color: #ff007f; box-shadow: 0 5px 0 #b30059; opacity: 0.8; pointer-events: none; }

        /* FLOATING XP PARTICLES */
        .xp-pop {
            position: absolute; font-family: 'Righteous', cursive; font-size: 2.2rem; color: #66fcf1;
            text-shadow: 0 0 15px rgba(102,252,241,0.8), 0px 4px 0px #000;
            pointer-events: none; z-index: 1000; transform: translate(-50%, -50%);
            animation: floatUp 1s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }
        .xp-pop.crit { color: #ff007f; font-size: 3rem; text-shadow: 0 0 20px rgba(255,0,127,0.8), 0px 4px 0px #000; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            30% { transform: translate(-50%, -120%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -250%) scale(1); }
        }

        /* MODAL */
        #custom-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,12,16,0.95); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.2s ease; }
        #custom-modal.show { opacity: 1; pointer-events: all; }
        .modal-content { background: #1f2833; border-radius: 20px; padding: 40px 20px; text-align: center; width: 85%; transform: scale(0.9); transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 2px solid #66fcf1; }
        #custom-modal.show .modal-content { transform: scale(1); }
        .modal-title { font-family: 'Righteous', cursive; font-size: 2.5rem; color: #66fcf1; margin-bottom: 10px; line-height: 1.1; }
        .modal-desc { font-size: 1.3rem; font-weight: 900; color: #c5c6c7; margin-bottom: 30px; }
        .modal-btn { background: #ff007f; color: #fff; font-family: 'Righteous', cursive; font-size: 1.8rem; padding: 15px 30px; border: none; border-radius: 12px; cursor: pointer; width: 100%; transition: 0.1s; box-shadow: 0 5px 0 #b30059; }
        .modal-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 #b30059; }
        
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0c10; display: flex; justify-content: center; align-items: center; z-index: 150; color: #66fcf1; font-family: 'Righteous', cursive; font-size: 3rem; }
    </style>
</head>
<body>

<div id="damage-overlay"></div>

<div id="app-container">
    <div id="loading-screen">LOADING...</div>

    <div id="top-bar">
        <span class="hud-label">TOTAL SCORE</span>
        <div id="xp-box">0</div>
    </div>
    <div id="global-progress-bg"><div id="global-progress-fill"></div></div>

    <div id="flashcard">
        <div class="text-fit-container" style="height: 6rem;">
            <div id="word">...</div>
        </div>
        
        <button id="audio-btn" onclick="playAudio()">▶</button>
        
        <div class="text-fit-container" style="height: 5rem;">
            <div id="thai">...</div>
        </div>
    </div>

    <!-- ENGAGEMENT ZONE -->
    <div id="quiz-container">
        <div class="timer-wrap">
            <div id="timer-text">30.0</div>
        </div>
        
        <div class="quiz-center-wrap">
            <div class="text-fit-container" style="height: 6rem;">
                <div id="quiz-word">...</div>
            </div>
            <button id="audio-btn" style="margin-top: 15px; width: 70px; height: 70px; font-size: 2rem;" onclick="playQuizAudio()">▶</button>
        </div>
        
        <div id="quiz-options"></div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">...</div>
            <div class="modal-desc" id="modal-desc">...</div>
            <button class="modal-btn" onclick="closeModal()">CONTINUE</button>
        </div>
    </div>

    <div id="controls">
        <button id="back-btn" class="nav-btn" onclick="prevWord()">PREV</button>
        <button id="next-btn" class="nav-btn" onclick="nextWord()">NEXT</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
