<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syntax Swipe PRO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-color: #0A192F;
            --card-bg: #FFFFFF;
            --text-main: #112A46;
            --text-sub: #64748B;
            --accent-teal: #00B4D8;
            --accent-coral: #EF476F;
            --success-green: #06D6A0;
            --border-light: #E2E8F0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box;
        }

        /* Professional Progress HUD */
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.1); border-radius: 16px;
            padding: 15px 20px; margin-bottom: 30px; backdrop-filter: blur(10px);
        }
        .metric { display: flex; flex-direction: column; align-items: center; }
        .metric-value { font-size: 24px; font-weight: 800; color: #fff; }
        .metric-label { font-size: 11px; font-weight: 600; color: var(--accent-teal); text-transform: uppercase; letter-spacing: 1px; }
        .divider { width: 1px; height: 30px; background: rgba(255, 255, 255, 0.2); }

        /* The Swipe Card Stage */
        .stage {
            flex-grow: 1; display: flex; flex-direction: column; position: relative;
        }

        .pattern-title {
            text-align: center; color: var(--accent-teal); font-size: 14px;
            font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px;
        }

        .flashcard {
            background: var(--card-bg); border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); padding: 40px 25px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 350px; position: relative; transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .template-hint {
            font-size: 16px; color: var(--text-sub); font-weight: 600;
            margin-bottom: 30px; text-align: center; padding: 10px;
            background: #F8FAFC; border-radius: 12px; width: 100%; box-sizing: border-box;
            border: 1px solid var(--border-light);
        }

        .english-sentence {
            font-size: 28px; font-weight: 800; text-align: center;
            line-height: 1.4; color: var(--text-main); margin-bottom: 20px;
        }

        /* The filled blank style */
        .highlight-blank { color: var(--accent-coral); position: relative; display: inline-block;}
        .highlight-blank::after {
            content: ''; position: absolute; left: 0; bottom: -4px;
            width: 100%; height: 3px; background-color: var(--accent-coral); border-radius: 2px;
        }

        .thai-translation {
            font-size: 18px; color: var(--text-sub); text-align: center; font-weight: 500;
        }

        /* Controls */
        .card-controls {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; margin-top: 40px;
        }

        .swipe-btn {
            background: #F1F5F9; border: none; color: var(--text-main);
            width: 50px; height: 50px; border-radius: 25px; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s;
        }
        .swipe-btn:active { background: #E2E8F0; }
        .swipe-btn:disabled { opacity: 0.3; pointer-events: none; }

        .audio-btn {
            background: var(--accent-teal); border: none; color: #fff;
            width: 64px; height: 64px; border-radius: 32px; font-size: 28px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0, 180, 216, 0.3); transition: transform 0.1s;
        }
        .audio-btn:active { transform: scale(0.95); }

        /* Next Structure Button */
        .next-pattern-btn {
            margin-top: 30px; background: var(--success-green); color: #fff;
            border: none; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(6, 214, 160, 0.2); transition: opacity 0.3s;
            opacity: 0.5; pointer-events: none;
        }
        .next-pattern-btn.active { opacity: 1; pointer-events: auto; }
        .next-pattern-btn:active { transform: scale(0.98); }

        /* Pagination Dots */
        .pagination { display: flex; gap: 8px; position: absolute; bottom: 20px; }
        .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--border-light); transition: all 0.3s;}
        .dot.active { background: var(--accent-teal); width: 24px; }

    </style>
</head>
<body>

    <div class="app-container" id="main-container">
        
        <!-- Metrics HUD -->
        <div class="hud">
            <div class="metric">
                <span class="metric-value" id="metric-structures">0</span>
                <span class="metric-label">Structures</span>
            </div>
            <div class="divider"></div>
            <div class="metric">
                <span class="metric-value" id="metric-sentences">0</span>
                <span class="metric-label">Sentences</span>
            </div>
        </div>

        <div class="pattern-title" id="pattern-title">Loading...</div>

        <!-- Stage -->
        <div class="stage" id="stage">
            
            <div class="flashcard" id="flashcard">
                <div class="template-hint" id="template-hint">Template: ...</div>
                
                <div class="english-sentence" id="english-sentence">Loading...</div>
                <div class="thai-translation" id="thai-translation">กำลังโหลด...</div>

                <div class="card-controls">
                    <button class="swipe-btn" id="btn-prev" onclick="prevExample()">❮</button>
                    <button class="audio-btn" onclick="playAudio()">🔊</button>
                    <button class="swipe-btn" id="btn-next" onclick="nextExample()">❯</button>
                </div>

                <div class="pagination" id="pagination"></div>
            </div>

            <button class="next-pattern-btn" id="btn-next-pattern" onclick="loadNextPattern()">Next Structure ➔</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
