<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Physics.app MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevent pull-to-refresh on mobile apps to feel more native */
        body { overscroll-behavior-y: none; }
        .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased select-none">
    
    <!-- Main App Container -->
    <div id="app" class="max-w-md mx-auto min-h-screen sm:border-x sm:border-slate-800 shadow-2xl flex flex-col relative">
        
        <!-- Dashboard View (Initially Hidden) -->
        <div id="dashboard-view" class="flex-1 p-5 hidden">
            <div class="flex justify-between items-center mb-8 mt-4">
                <div>
                    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">Physics.app</h1>
                    <p class="text-slate-400 text-sm mt-1">Ready to train your brain?</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-8">
                <button onclick="app.startQuiz('mix')" class="tap-highlight-transparent bg-gradient-to-br from-indigo-600 to-purple-600 p-4 rounded-2xl font-bold shadow-lg shadow-indigo-900/50 active:scale-95 transition-transform text-center">
                    Mix All Topics
                </button>
            </div>

            <h2 class="text-lg font-semibold mb-4 text-slate-300">Study by Topic</h2>
            <div id="topics-list" class="space-y-3 pb-10">
                <!-- Topics will be injected here by app.js -->
            </div>
        </div>

        <!-- Quiz View (Initially Hidden) -->
        <div id="quiz-view" class="flex-1 flex flex-col hidden">
            <!-- Progress Header -->
            <header class="p-4 flex items-center space-x-4 border-b border-slate-800 sticky top-0 bg-slate-900 z-10">
                <button onclick="app.showDashboard()" class="tap-highlight-transparent text-slate-400 hover:text-white font-bold text-2xl px-2">&times;</button>
                <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                    <div id="progress-bar" class="bg-emerald-500 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </header>

            <!-- Question Area -->
            <main class="flex-1 p-5 flex flex-col">
                <div id="question-topic" class="mb-2 text-sm text-indigo-400 font-semibold tracking-wider uppercase"></div>
                <h2 id="question-text" class="text-xl md:text-2xl font-medium leading-relaxed mb-6"></h2>
                
                <div id="question-figure" class="mb-6 rounded-xl overflow-hidden border border-slate-700 bg-slate-800 flex items-center justify-center p-2 hidden">
                    <img id="figure-img" src="" alt="Figure" class="max-h-48 object-contain" />
                </div>

                <!-- 3x3 Grid for 9 choices -->
                <div id="choices-grid" class="grid grid-cols-3 gap-2 sm:gap-3 mt-auto mb-4">
                    <!-- Buttons injected here by app.js -->
                </div>
            </main>

            <!-- Footer Action -->
            <footer id="quiz-footer" class="p-4 border-t border-slate-800 bg-slate-900 pb-8 min-h-[120px] flex flex-col justify-center">
                <button id="action-btn" class="tap-highlight-transparent w-full py-4 rounded-2xl font-bold text-lg transition-all bg-slate-800 text-slate-500 cursor-not-allowed" disabled>
                    Select an answer
                </button>
            </footer>
        </div>

        <!-- Loading State -->
        <div id="loading-view" class="flex-1 flex items-center justify-center">
            <div class="animate-pulse text-indigo-400 font-bold text-xl">Loading Physics DB...</div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
