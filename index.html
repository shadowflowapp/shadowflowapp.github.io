<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluency: Minimalist</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        
        body { 
            background: #0f1115; display: flex; justify-content: center; align-items: center; 
            height: 100dvh; overflow: hidden; touch-action: pan-y; color: #e2e8f0;
        }

        #app-container {
            width: 100%; max-width: 420px; height: 100dvh; background: #181b21;
            display: flex; flex-direction: column; position: relative; 
            border: 1px solid #23272f; overflow: hidden;
        }
        @media (min-width: 421px) { #app-container { height: 95dvh; border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); } }

        /* A-Z NAVIGATION BAR */
        #letter-nav {
            display: flex; overflow-x: auto; gap: 10px; padding: 20px;
            background: rgba(15, 17, 21, 0.9); border-bottom: 1px solid #23272f;
            scrollbar-width: none; flex-shrink: 0;
        }
        #letter-nav::-webkit-scrollbar { display: none; } 
        
        .letter-btn {
            background: transparent; color: #64748b; border: none; font-size: 1.2rem;
            font-weight: 800; padding: 5px 15px; cursor: pointer; transition: 0.2s;
            border-radius: 12px;
        }
        .letter-btn.active { background: #38bdf8; color: #0f1115; }

        /* FLASHCARD */
        #flashcard { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; overflow-y: auto; }
        
        #word { font-size: 3.5rem; font-weight: 800; color: #f8fafc; letter-spacing: -1px; text-transform: capitalize; line-height: 1.1; margin-bottom: 5px; }
        #ipa { font-size: 1.2rem; color: #38bdf8; font-weight: 600; margin-bottom: 30px; letter-spacing: 1px; }

        .play-btn {
            width: 70px; height: 70px; border-radius: 50%; border: 1px solid #2d333b;
            background: #23272f; color: #38bdf8; font-size: 2rem; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s ease; margin-bottom: 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); flex-shrink: 0;
        }
        .play-btn:active { transform: scale(0.9); background: #1e2228; }

        /* DEFINITION */
        .def-container { width: 100%; }
        #definition { font-size: 1.3rem; color: #cbd5e1; font-weight: 400; line-height: 1.6; }

        /* BOTTOM UI (Scrubber + Controls) */
        #bottom-ui {
            background: #0f1115; border-top: 1px solid #23272f; flex-shrink: 0;
            display: flex; flex-direction: column; padding: 20px 25px 30px 25px; gap: 20px;
        }

        /* SLIDER / SCRUBBER */
        .scrubber-header { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 800; color: #64748b; letter-spacing: 1px; margin-bottom: 10px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #23272f; border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { height: 24px; width: 24px; border-radius: 50%; background: #38bdf8; cursor: pointer; -webkit-appearance: none; margin-top: -8px; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

        /* CONTROLS (Buttons) */
        #controls { display: flex; gap: 15px; }
        .nav-btn {
            flex: 1; padding: 18px; font-size: 1rem; font-weight: 800; border: none; border-radius: 16px;
            cursor: pointer; transition: 0.2s ease; letter-spacing: 1px;
        }
        #back-btn { background: #1e2228; color: #64748b; border: 1px solid #2d333b; }
        #back-btn:active { background: #181b21; transform: scale(0.98); }
        
        #next-btn { background: #38bdf8; color: #0f1115; box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2); }
        #next-btn:active { transform: scale(0.98); box-shadow: 0 5px 10px rgba(56, 189, 248, 0.1); }

        #loading-screen, #error-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f1115; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 150; color: #38bdf8; font-weight: 800; font-size: 1.5rem; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="loading-screen">LOADING SYSTEM...</div>
    <div id="error-screen" style="display: none;">NO DATA FOUND FOR THIS LETTER.</div>

    <!-- A-Z Navigation -->
    <div id="letter-nav"></div>

    <!-- Minimalist Flashcard -->
    <div id="flashcard">
        <div id="word">...</div>
        <div id="ipa">...</div>
        <button class="play-btn" onclick="playWordAudio()">▶</button>
        
        <div class="def-container">
            <div id="definition">...</div>
        </div>
    </div>

    <!-- Bottom Scrubber & Buttons -->
    <div id="bottom-ui">
        <div id="scrubber-container">
            <div class="scrubber-header">
                <span>START</span>
                <span id="word-count-display">0 / 0</span>
            </div>
            <input type="range" id="word-slider" min="0" max="0" value="0" oninput="scrubWord()">
        </div>
        
        <div id="controls">
            <button id="back-btn" class="nav-btn" onclick="prevWord()">PREV</button>
            <button id="next-btn" class="nav-btn" onclick="nextWord()">NEXT</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
