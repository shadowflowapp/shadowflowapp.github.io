<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pattern Swipe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-radius: 20px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .xp-badge {
            background: var(--accent-blue); color: #fff;
            padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 14px;
        }
        .level-text { font-weight: 600; color: var(--text-sub); }

        /* Card Container */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            flex-grow: 1; display: flex; flex-direction: column;
            padding: 30px 20px; position: relative; overflow: hidden;
        }

        /* Study Mode */
        .pattern-header { font-size: 14px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; text-align: center; margin-bottom: 10px;}
        .pattern-desc { text-align: center; font-size: 14px; color: var(--text-sub); margin-bottom: 30px;}
        
        .swipe-area {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            margin-bottom: 30px; flex-grow: 1;
        }

        .nav-btn {
            background: #f3f4f6; border: none; width: 40px; height: 40px;
            border-radius: 50%; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-sub); transition: all 0.2s;
        }
        .nav-btn:active { transform: scale(0.9); background: #e5e7eb; }

        .sentence-display {
            text-align: center; font-size: 28px; font-weight: 800; line-height: 1.4;
            flex-grow: 1;
        }
        .filler-slot {
            color: var(--accent-blue); border-bottom: 3px solid var(--accent-blue);
            display: inline-block; transition: all 0.3s ease;
        }

        .thai-translation {
            text-align: center; font-size: 18px; color: var(--text-main); font-weight: 600;
            background: #f9fafb; padding: 15px; border-radius: 12px; margin-bottom: 20px;
            min-height: 60px; display: flex; align-items: center; justify-content: center;
        }

        .audio-btn {
            background: #eff6ff; color: var(--accent-blue); border: none;
            width: 60px; height: 60px; border-radius: 50%; font-size: 24px;
            margin: 0 auto 20px auto; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);
        }
        .audio-btn:active { transform: scale(0.9); }

        .action-btn {
            background: var(--text-main); color: #fff; border: none;
            padding: 18px; border-radius: 15px; font-size: 18px; font-weight: 800;
            cursor: pointer; width: 100%; transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.98); }

        /* Quiz Mode */
        #quiz-mode { display: none; }
        .quiz-target-thai {
            font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 20px;
            color: var(--accent-blue);
        }
        .quiz-template {
            font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 40px;
        }
        .quiz-blank { color: #d1d5db; border-bottom: 3px solid #d1d5db; }
        
        .options-grid { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
        .option-btn {
            background: #f9fafb; border: 2px solid #e5e7eb; color: var(--text-main);
            padding: 18px 15px; border-radius: 12px; font-size: 18px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .option-btn:active { background: #e5e7eb; }
        .option-btn.correct { background: #ecfdf5; border-color: var(--accent-green); color: var(--accent-green); }
        .option-btn.wrong { background: #fef2f2; border-color: var(--accent-red); color: var(--accent-red); }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="level-text">Structure <span id="level-display">1</span>/3</div>
            <div class="xp-badge">⭐ <span id="xp-display">0</span> XP</div>
        </div>

        <!-- STUDY MODE (Swipeable Patterns) -->
        <div class="card" id="study-mode">
            <div class="pattern-header">Current Pattern</div>
            <div class="pattern-desc" id="pattern-desc">Loading description...</div>

            <div class="swipe-area">
                <button class="nav-btn" onclick="prevFiller()">◀</button>
                
                <div class="sentence-display" id="sentence-display">
                    <!-- Template injected here -->
                </div>
                
                <button class="nav-btn" onclick="nextFiller()">▶</button>
            </div>

            <div class="thai-translation" id="thai-translation">Loading...</div>

            <button class="audio-btn" onclick="playAudio()">🔊</button>
            
            <button class="action-btn" onclick="startQuiz()">Take Pattern Quiz</button>
        </div>

        <!-- QUIZ MODE -->
        <div class="card" id="quiz-mode">
            <div class="pattern-header">Fill the Blank</div>
            
            <div class="quiz-target-thai" id="quiz-target-thai">...</div>
            <div class="quiz-template" id="quiz-template">...</div>

            <div class="options-grid" id="options-grid"></div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
