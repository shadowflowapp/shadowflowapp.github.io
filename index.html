<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mr. Beast Word Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #000; 
            display: flex; justify-content: center; align-items: center; 
            height: 100dvh; overflow: hidden; 
            font-family: 'Nunito', sans-serif;
        }

        #app-container {
            width: 100%; max-width: 420px; height: 100dvh; max-height: 900px;
            background: radial-gradient(circle, #2a0066 0%, #000000 100%);
            color: #fff; display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 50px rgba(0,229,255,0.3); 
            border-radius: 20px; overflow: hidden;
            border: 4px solid #111;
        }
        @media (max-width: 420px) { #app-container { border-radius: 0; border: none; } }

        /* UPGRADED HEADER & PROGRESS TRACKER */
        #top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; background: #ffe600; color: #000; 
            font-family: 'Bangers', cursive; z-index: 10; flex-shrink: 0; 
        }
        
        #stage-badge {
            background: #ff007f; color: #fff; padding: 5px 15px; 
            border-radius: 12px; font-size: 1.8rem; letter-spacing: 1px;
            border: 3px solid #000; box-shadow: 3px 3px 0 #000;
        }

        #score-box { font-size: 1.8rem; letter-spacing: 1px; text-shadow: 1px 1px 0 #fff; }

        /* THE FINISHER XP BAR */
        #global-progress-bg { 
            width: 100%; height: 12px; background: #222; 
            border-bottom: 4px solid #111; flex-shrink: 0; 
        }
        #global-progress-fill { 
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, #00e5ff, #00ff00); 
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6); 
        }

        /* FLASHCARD AREA */
        #flashcard { 
            flex: 1; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            padding: 20px; text-align: center; width: 100%;
        }
        
        #word { 
            font-family: 'Bangers', cursive; font-size: clamp(2.5rem, 12vw, 4.5rem); 
            color: #ffffff; letter-spacing: 2px; line-height: 1.1;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            margin-bottom: 10px; width: 100%; word-wrap: break-word; padding: 0 10px;
        }
        
        #pronunciation { 
            font-size: 1.5rem; font-weight: 900; margin-bottom: 15px; 
            color: #ff007f; text-shadow: 2px 2px 0 #000;
            font-family: 'Courier New', Courier, monospace;
        }
        
        #pos { 
            background: #ff007f; color: white; padding: 5px 15px; 
            border-radius: 20px; font-weight: 900; text-transform: uppercase; 
            font-size: 1rem; border: 3px solid #000; box-shadow: 3px 3px 0 #000;
            margin-bottom: 25px;
        }

        #audio-btn { 
            background: #00e5ff; color: #000; 
            width: 80px; height: 80px; border-radius: 50%; 
            font-size: 2.5rem; display: flex; justify-content: center; align-items: center;
            border: 4px solid #000; cursor: pointer;
            box-shadow: 0 8px 0 #008899, 0 15px 20px rgba(0,0,0,0.5);
            margin-bottom: 30px; transition: 0.1s;
        }
        #audio-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #008899; }
        
        #thai { 
            font-size: clamp(2rem, 10vw, 3rem); color: #ffe600; font-weight: 900; 
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            line-height: 1.1; width: 100%; word-wrap: break-word; padding: 0 10px;
        }
        
        /* BOTTOM CONTROLS */
        #controls { 
            display: flex; gap: 15px; padding: 20px; 
            background: rgba(0,0,0,0.8); flex-shrink: 0;
        }
        
        .nav-btn {
            flex: 1; padding: 20px; font-size: 1.5rem; font-weight: 900; 
            border: 4px solid #000; border-radius: 15px; cursor: pointer;
            text-transform: uppercase; transition: 0.1s;
        }
        #back-btn { background: #fff; color: #000; box-shadow: 0 6px 0 #999; }
        #back-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #999; }
        
        #next-btn { background: #ffe600; color: #000; box-shadow: 0 6px 0 #ccb800; flex: 1.5; font-size: 1.8rem; }
        #next-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #ccb800; }

        /* THE GAUNTLET QUIZ */
        #quiz-container { 
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: repeating-linear-gradient(45deg, #111, #111 20px, #000 20px, #000 40px);
            flex-direction: column; justify-content: space-between; align-items: center; 
            padding: 20px 15px 40px 15px; z-index: 20;
        }

        .danger-pulse { animation: dangerBg 0.5s infinite alternate; }
        @keyframes dangerBg { from { box-shadow: inset 0 0 20px #ff0000; } to { box-shadow: inset 0 0 80px #ff0000; } }

        #timer-text { font-family: 'Bangers', cursive; font-size: 5rem; color: #fff; text-shadow: 4px 4px 0 #ff0000; margin-top: 10px; line-height: 1; }
        #quiz-word { font-family: 'Bangers', cursive; font-size: clamp(2.5rem, 12vw, 4rem); color: #ffe600; text-shadow: 4px 4px 0 #000; text-align: center; width: 100%; margin-bottom: auto; margin-top: 20vh; word-wrap: break-word; padding: 0 10px; }

        #quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: auto; }
        .quiz-option { padding: 25px 10px; font-size: clamp(1.2rem, 6vw, 1.8rem); font-weight: 900; color: #fff; border: 4px solid #000; border-radius: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; text-shadow: 2px 2px 0 #000; transition: 0.1s; text-align: center; word-wrap: break-word; }
        .opt-0 { background: #e21b3c; box-shadow: 0 8px 0 #8c1024; }
        .opt-1 { background: #1368ce; box-shadow: 0 8px 0 #0c4284; }
        .opt-2 { background: #d89e00; box-shadow: 0 8px 0 #8a6500; }
        .opt-3 { background: #26890c; box-shadow: 0 8px 0 #185707; }

        .quiz-option:active { transform: translateY(8px); box-shadow: 0 0px 0 #000 !important; }
        .quiz-option.correct { background: #00ff00 !important; color: #000; text-shadow: none; box-shadow: 0 8px 0 #009900 !important; }
        .quiz-option.wrong { background: #333 !important; color: #555; text-shadow: none; box-shadow: 0 8px 0 #111 !important; opacity: 0.5; }

        /* CUSTOM MODAL POPUP */
        #custom-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        #custom-modal.show { opacity: 1; pointer-events: all; }
        .modal-content { background: #1a1a1a; border: 6px solid #ff007f; border-radius: 20px; padding: 40px 20px; text-align: center; width: 85%; box-shadow: 0 10px 40px rgba(255,0,127,0.6); transform: scale(0.7); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #custom-modal.show .modal-content { transform: scale(1); }
        .modal-title { font-family: 'Bangers', cursive; font-size: 3.5rem; color: #ff007f; text-shadow: 2px 2px 0 #000; margin-bottom: 10px; line-height: 1; }
        .modal-desc { font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 30px; }
        .modal-btn { background: #ffe600; color: #000; font-family: 'Bangers', cursive; font-size: 2rem; padding: 15px 30px; border: 4px solid #000; border-radius: 15px; cursor: pointer; box-shadow: 0 6px 0 #ccb800; transition: 0.1s; width: 100%; }
        .modal-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #ccb800; }

        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 50; color: #ffe600; font-family: 'Bangers', cursive; font-size: 3rem; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="loading-screen">LOADING...</div>

    <!-- NEW XP TRACKER HEADER -->
    <div id="top-bar">
        <div id="stage-badge">STAGE: <span id="current-letter">A</span></div>
        <div id="score-box"><span id="score">0</span> / <span id="total-words">0</span></div>
    </div>
    <div id="global-progress-bg"><div id="global-progress-fill"></div></div>

    <div id="flashcard">
        <div id="pos">...</div>
        <div id="word">...</div>
        <div id="pronunciation" id="ipa">...</div>
        <button id="audio-btn" onclick="playAudio()">▶</button>
        <div id="thai">...</div>
    </div>

    <div id="quiz-container">
        <div id="timer-text">30.0</div>
        <div id="quiz-word">...</div>
        <div id="quiz-options"></div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">...</div>
            <div class="modal-desc" id="modal-desc">...</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <div id="controls">
        <button id="back-btn" class="nav-btn" onclick="prevWord()">Back</button>
        <button id="next-btn" class="nav-btn" onclick="nextWord()">NEXT!</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
