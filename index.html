<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Rabbit Hole</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        #english-sentence {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        /* The magic happens here: making words look clickable */
        .clickable-word {
            cursor: pointer;
            display: inline-block;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }
        .clickable-word:active {
            background-color: #e0e0e0;
        }
        #thai-translation {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            min-height: 50px;
        }
        .stats {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
        }
        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:active {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="stats">Sentences explored: <span id="streak-counter">0</span></div>
        
        <div id="english-sentence">Loading...</div>
        <div id="thai-translation"></div>

        <button onclick="loadRandomSentence()">Skip / Random Sentence</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
