<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocab Quest</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@400;700;900&display=swap');

        :root {
            --bg-color: #2b231d;
            --parchment: #f4e8c1;
            --wood-dark: #3e2723;
            --wood-light: #5d4037;
            --gold: #d4af37;
            --xp-green: #4caf50;
            --text-dark: #3e2723;
            --action-blue: #1976d2;
            --danger-red: #d32f2f;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            color: var(--text-dark);
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column;
            padding: 15px; box-sizing: border-box;
            position: relative;
        }

        /* RPG HUD */
        .hud {
            background: var(--wood-dark);
            border: 3px solid var(--gold);
            border-radius: 12px; padding: 10px 15px;
            margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            color: #fff; display: flex; flex-direction: column; gap: 8px;
        }
        .hud-top { display: flex; justify-content: space-between; align-items: center; }
        .player-title { font-family: 'Cinzel', serif; font-size: 20px; color: var(--gold); text-shadow: 1px 1px 2px #000; }
        .hearts { font-size: 18px; color: #ff5252; }
        
        .xp-bar-bg { width: 100%; height: 10px; background: #222; border-radius: 5px; border: 1px solid var(--gold); overflow: hidden; }
        .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #81c784); width: 0%; transition: width 0.3s ease; }
        .xp-text { font-size: 12px; text-align: right; color: #ddd; font-weight: 700; margin-top: 2px;}

        /* The Spellbook (Flashcard) */
        .card {
            background-color: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            border: 4px solid var(--wood-light);
            border-radius: 16px; padding: 20px;
            flex-grow: 1; display: flex; flex-direction: column;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            overflow-y: auto; text-align: center; position: relative;
        }

        .card-image {
            width: 100%; height: 180px; object-fit: cover;
            border-radius: 8px; border: 3px solid var(--wood-dark);
            margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Study Mode Elements */
        .word-header { margin-bottom: 10px; }
        .target-word { font-family: 'Cinzel', serif; font-size: 36px; color: var(--wood-dark); font-weight: 700; text-transform: capitalize;}
        .phonetic { font-size: 16px; color: #555; margin-bottom: 5px; font-family: monospace; }
        .pos-badge {
            display: inline-block; background: var(--wood-light); color: var(--parchment);
            padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; text-transform: uppercase;
        }

        .translation { font-size: 20px; font-weight: 900; color: var(--action-blue); margin: 15px 0; }
        
        .sentence-box {
            background: rgba(255,255,255,0.5); border: 2px dashed var(--wood-light);
            padding: 15px; border-radius: 12px; font-size: 18px; font-weight: 700; color: var(--text-dark);
            margin-bottom: 20px;
        }

        .audio-controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .audio-btn {
            background: var(--gold); border: 2px solid var(--wood-dark);
            color: var(--wood-dark); font-size: 16px; font-weight: 900;
            padding: 10px 15px; border-radius: 20px; cursor: pointer;
            box-shadow: 0 4px 0 var(--wood-light); display: flex; align-items: center; gap: 5px;
        }
        .audio-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--wood-light); }

        .battle-btn {
            background: var(--danger-red); border: 3px solid var(--wood-dark);
            color: #fff; font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700;
            padding: 15px; border-radius: 12px; cursor: pointer; margin-top: auto;
            box-shadow: 0 4px 0 #8e0000; text-transform: uppercase;
        }
        .battle-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #8e0000; }

        /* Quiz Mode Elements */
        #quiz-mode { display: none; }
        .quiz-title { font-family: 'Cinzel', serif; font-size: 22px; color: var(--danger-red); margin-bottom: 15px; }
        .blank-sentence { font-size: 20px; font-weight: 900; margin-bottom: 25px; line-height: 1.5; }
        .blank { display: inline-block; min-width: 80px; border-bottom: 3px solid var(--wood-dark); color: transparent; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn {
            background: var(--wood-light); color: var(--parchment); border: 2px solid var(--wood-dark);
            padding: 15px 10px; border-radius: 10px; font-size: 18px; font-weight: 700; text-transform: capitalize;
            cursor: pointer; box-shadow: 0 4px 0 var(--wood-dark); transition: all 0.1s;
        }
        .option-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--wood-dark); }
        
        .option-btn.correct { background: var(--xp-green); color: #fff; }
        .option-btn.wrong { background: var(--danger-red); color: #fff; }

        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .victory-bg { background: rgba(76, 175, 80, 0.8); }
        .defeat-bg { background: rgba(211, 47, 47, 0.8); }
        .overlay-text {
            font-family: 'Cinzel', serif; font-size: 40px; color: var(--gold);
            text-transform: uppercase; text-shadow: 2px 2px 4px #000; margin-bottom: 10px;
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- RPG HUD -->
        <div class="hud">
            <div class="hud-top">
                <div class="player-title" id="player-title">Novice Explorer</div>
                <div class="hearts" id="hearts">❤️❤️❤️</div>
            </div>
            <div>
                <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
                <div class="xp-text">Level <span id="lvl-display">1</span> • XP: <span id="xp-display">0</span> / 100</div>
            </div>
        </div>

        <!-- STUDY MODE (The Spellbook) -->
        <div class="card" id="study-mode">
            <img class="card-image" id="study-image" src="" alt="Word Image">
            
            <div class="word-header">
                <div class="target-word" id="target-word">loading</div>
                <div class="phonetic" id="phonetic"></div>
                <div class="pos-badge" id="pos"></div>
            </div>

            <div class="translation" id="translation"></div>
            
            <div class="audio-controls">
                <button class="audio-btn" onclick="playWord()">🔊 Word</button>
                <button class="audio-btn" onclick="playSentence()">🗣️ Sentence</button>
            </div>

            <div class="sentence-box" id="study-sentence"></div>

            <button class="battle-btn" onclick="startBattle()">⚔️ Enter Battle</button>
        </div>

        <!-- QUIZ MODE (The Encounter) -->
        <div class="card" id="quiz-mode">
            <div class="quiz-title">Wild Encounter!</div>
            <img class="card-image" id="quiz-image" src="" alt="Quiz Image">
            
            <div class="blank-sentence" id="quiz-sentence"></div>

            <div class="options-grid" id="options-grid">
                <!-- Options injected here -->
            </div>
        </div>

        <!-- OVERLAYS -->
        <div class="overlay victory-bg" id="overlay-victory">
            <div class="overlay-text">VICTORY!</div>
            <div style="color: #fff; font-size: 20px; font-weight: 700;">+20 XP</div>
        </div>

        <div class="overlay defeat-bg" id="overlay-defeat">
            <div class="overlay-text">DEFEAT...</div>
            <div style="color: #fff; font-size: 20px; font-weight: 700;">Lost 1 Heart</div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
