<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluency Intuition Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100dvh; overflow: hidden; }

        #app-container {
            width: 100%; max-width: 420px; height: 100dvh; max-height: 900px;
            background: radial-gradient(circle, #1a0033 0%, #000000 100%);
            color: #fff; display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 50px rgba(0,229,255,0.2); 
            border: 4px solid #111; overflow: hidden;
        }
        @media (max-width: 420px) { #app-container { border: none; } }

        /* HEADER & PROGRESS */
        #top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #00e5ff; color: #000; font-family: 'Bangers', cursive; z-index: 10; }
        #stage-badge { background: #000; color: #00e5ff; padding: 5px 15px; border-radius: 12px; font-size: 1.5rem; letter-spacing: 1px; }
        #score-box { font-size: 1.8rem; letter-spacing: 1px; }
        #global-progress-bg { width: 100%; height: 10px; background: #222; }
        #global-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff007f, #ffe600); transition: width 0.4s; }

        /* LEARNING SCREEN */
        #flashcard { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        
        .tag { background: #ff007f; color: white; padding: 5px 15px; border-radius: 20px; font-weight: 900; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 20px; }
        
        #chunk { font-family: 'Bangers', cursive; font-size: clamp(3rem, 12vw, 4.5rem); color: #ffe600; text-shadow: 3px 3px 0 #000; margin-bottom: 15px; line-height: 1.1; word-wrap: break-word; }
        
        #sentence { font-size: 1.3rem; color: #ccc; font-style: italic; margin-bottom: 30px; line-height: 1.4; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; border-left: 4px solid #00e5ff; }
        
        #audio-btn { background: #00e5ff; color: #000; width: 70px; height: 70px; border-radius: 50%; font-size: 2rem; border: 4px solid #000; cursor: pointer; box-shadow: 0 6px 0 #008899; margin-bottom: 20px; transition: 0.1s; }
        #audio-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #008899; }
        
        #thai { font-size: 1.5rem; color: #00ff00; font-weight: 900; text-shadow: 2px 2px 0 #000; }

        /* CONTROLS */
        #controls { display: flex; gap: 15px; padding: 20px; background: rgba(0,0,0,0.9); flex-shrink: 0; }
        .nav-btn { flex: 1; padding: 20px; font-size: 1.5rem; font-weight: 900; border: 4px solid #000; border-radius: 15px; cursor: pointer; text-transform: uppercase; transition: 0.1s; font-family: 'Bangers', cursive; }
        #back-btn { background: #333; color: #fff; box-shadow: 0 6px 0 #111; }
        #back-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #111; }
        #next-btn { background: #ffe600; color: #000; box-shadow: 0 6px 0 #ccb800; flex: 2; font-size: 2rem; }
        #next-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #ccb800; }

        /* THE CLOZE GAUNTLET */
        #quiz-container, #ambush-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 15px 40px 15px; z-index: 20; }
        
        #quiz-container { background: repeating-linear-gradient(45deg, #111, #111 20px, #000 20px, #000 40px); }
        .danger-pulse { animation: dangerBg 0.5s infinite alternate; }
        @keyframes dangerBg { from { box-shadow: inset 0 0 20px #ff007f; } to { box-shadow: inset 0 0 80px #ff007f; } }

        .timer-text { font-family: 'Bangers', cursive; font-size: 4rem; color: #fff; text-shadow: 3px 3px 0 #ff0000; line-height: 1; margin-top: 10px; }
        
        #quiz-sentence { font-size: 1.8rem; color: #fff; text-align: center; margin-top: 10vh; margin-bottom: auto; line-height: 1.4; font-weight: 900; }
        .blank-space { color: #ffe600; text-decoration: underline; text-decoration-color: #ff007f; text-decoration-thickness: 4px; }

        /* THE AMBUSH (Blind Audio) */
        #ambush-container { background: #0a0000; }
        .ambush-siren { animation: sirenFlash 0.3s infinite alternate; }
        @keyframes sirenFlash { from { background-color: #0a0000; } to { background-color: #4a0000; } }
        
        #ambush-title { font-family: 'Bangers', cursive; font-size: 3.5rem; color: #ff0000; margin-top: 5vh; text-shadow: 2px 2px 0 #000; text-align: center; line-height: 1; }
        #ambush-desc { font-size: 1.2rem; color: #fff; text-align: center; margin-bottom: auto; font-weight: 900; margin-top: 10px; }

        /* MULTIPLE CHOICE GRID */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: auto; }
        .quiz-option { padding: 20px 10px; font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: 900; color: #fff; border: 4px solid #000; border-radius: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; text-shadow: 2px 2px 0 #000; transition: 0.1s; text-align: center; font-family: 'Bangers', cursive; letter-spacing: 1px; }
        
        .opt-0 { background: #e21b3c; box-shadow: 0 6px 0 #8c1024; }
        .opt-1 { background: #1368ce; box-shadow: 0 6px 0 #0c4284; }
        .opt-2 { background: #d89e00; box-shadow: 0 6px 0 #8a6500; }
        .opt-3 { background: #26890c; box-shadow: 0 6px 0 #185707; }
        .quiz-option:active { transform: translateY(6px); box-shadow: 0 0px 0 #000 !important; }
        .quiz-option.correct { background: #00ff00 !important; color: #000; text-shadow: none; box-shadow: 0 6px 0 #009900 !important; }
        .quiz-option.wrong { background: #333 !important; color: #555; text-shadow: none; box-shadow: 0 6px 0 #111 !important; opacity: 0.5; }

        /* CUSTOM MODAL POPUP */
        #custom-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.2s ease; }
        #custom-modal.show { opacity: 1; pointer-events: all; }
        .modal-content { background: #1a1a1a; border: 6px solid #ff007f; border-radius: 20px; padding: 40px 20px; text-align: center; width: 85%; transform: scale(0.7); transition: 0.3s; }
        #custom-modal.show .modal-content { transform: scale(1); }
        .modal-title { font-family: 'Bangers', cursive; font-size: 3rem; color: #ff007f; margin-bottom: 10px; line-height: 1; }
        .modal-desc { font-size: 1.2rem; color: #fff; margin-bottom: 30px; font-weight: bold; }
        .modal-btn { background: #ffe600; font-family: 'Bangers', cursive; font-size: 2rem; padding: 15px 30px; border: 4px solid #000; border-radius: 15px; cursor: pointer; box-shadow: 0 6px 0 #ccb800; width: 100%; }
        
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 50; color: #00e5ff; font-family: 'Bangers', cursive; font-size: 3rem; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="loading-screen">LOADING...</div>

    <div id="top-bar">
        <div id="stage-badge">CHUNKS</div>
        <div id="score-box"><span id="score">0</span> / <span id="total-words">0</span></div>
    </div>
    <div id="global-progress-bg"><div id="global-progress-fill"></div></div>

    <!-- 1. LEARNING SCREEN -->
    <div id="flashcard">
        <div class="tag">Learn the Phrase</div>
        <div id="chunk">...</div>
        <button id="audio-btn" onclick="playAudio()">🔊</button>
        <div id="sentence">...</div>
        <div id="thai">...</div>
    </div>

    <!-- 2. THE CLOZE GAUNTLET (Test Context) -->
    <div id="quiz-container">
        <div id="quiz-timer" class="timer-text">30.0</div>
        <div class="tag" style="background: #ffe600; color: #000; margin-top: 10px;">FILL THE BLANK</div>
        <div id="quiz-sentence">...</div>
        <div id="quiz-options" class="options-grid"></div>
    </div>

    <!-- 3. BLIND AUDIO AMBUSH (Test Listening) -->
    <div id="ambush-container">
        <div id="ambush-timer" class="timer-text">7.0</div>
        <div id="ambush-title">BLIND AMBUSH!</div>
        <div id="ambush-desc">Listen to the sentence and select the CHUNK you heard!</div>
        <button id="audio-btn" style="margin-top: 20px;" onclick="replayAmbushAudio()">🔊</button>
        <div id="ambush-options" class="options-grid"></div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">...</div>
            <div class="modal-desc" id="modal-desc">...</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <div id="controls">
        <button id="back-btn" class="nav-btn" onclick="prevWord()">Back</button>
        <button id="next-btn" class="nav-btn" onclick="nextWord()">NEXT</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
