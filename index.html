<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Physics MCQ App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-dark: #0f172a;
            --surface: #1e293b;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 { margin: 0; color: var(--primary); font-size: 1.8rem; }
        .subtitle { color: var(--text-sub); font-size: 0.9rem; margin-top: 5px; }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--surface);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            max-height: 80vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* Views */
        #topic-view, #quiz-view, #result-view { display: none; width: 100%; }
        .active-view { display: flex !important; flex-direction: column; height: 100%; }

        /* Topic Menu */
        .topic-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .topic-btn:hover { border-color: var(--primary); background-color: rgba(56, 189, 248, 0.1); }

        /* Quiz UI */
        .progress-bar { font-size: 0.9rem; color: var(--primary); font-weight: 600; margin-bottom: 15px; }
        .question-text { font-size: 1.25rem; line-height: 1.5; font-weight: 600; margin-bottom: 20px; }
        
        .options-grid { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        .option-btn {
            background-color: #2a3b52;
            border: 2px solid transparent;
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .option-btn:hover:not(:disabled) { background-color: #3b5070; }
        
        .correct { background-color: rgba(34, 197, 94, 0.15) !important; border-color: var(--success) !important; }
        .wrong { background-color: rgba(239, 68, 68, 0.15) !important; border-color: var(--danger) !important; }
        
        .explanation {
            margin-top: 15px;
            padding: 12px;
            background-color: rgba(255,255,255,0.05);
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            font-size: 0.95rem;
            color: var(--text-sub);
            display: none;
        }

        .controls { margin-top: 20px; display: flex; justify-content: flex-end; }
        .primary-btn {
            background-color: var(--primary);
            color: var(--bg-dark);
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Results UI */
        .result-title { font-size: 2rem; text-align: center; color: var(--primary); margin-bottom: 10px; }
        .score-display { font-size: 3rem; font-weight: 800; text-align: center; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>PHYSICS MCQ</h1>
        <div class="subtitle">For Scientists and Engineers</div>
    </div>

    <div class="container">
        <!-- 1. Topic Selection View -->
        <div id="topic-view" class="active-view">
            <h2 style="font-size: 1.2rem; margin-top: 0; color: var(--text-sub);">Select a Chapter</h2>
            <div id="topic-list">Loading topics...</div>
        </div>

        <!-- 2. Active Quiz View -->
        <div id="quiz-view">
            <div class="progress-bar" id="progress-indicator">Question 1 / 10</div>
            <div class="question-text" id="question-text">Loading question...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="explanation" id="explanation-box"></div>
            <div class="controls">
                <button class="primary-btn" id="next-btn" disabled>Next Question</button>
            </div>
        </div>

        <!-- 3. Results View -->
        <div id="result-view">
            <div class="result-title">Topic Completed!</div>
            <div class="score-display" id="score-display">0 / 0</div>
            <div style="text-align: center; color: var(--text-sub); margin-bottom: 30px;">Correct Answers</div>
            <button class="primary-btn" style="width: 100%;" onclick="showTopicMenu()">Return to Chapters</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
