<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syntax Hacker: Phrase Decryptor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700;900&display=swap');

        :root {
            --gta-black: #0a0a0a; --gta-dark: #1c1c1e;
            --gta-green: #41d95d; --gta-red: #d94141;
            --gta-yellow: #f2c80f; --gta-cyan: #0fdbf2; --gta-pink: #f20f8c;
            --text-light: #ffffff; --text-dim: #888888;
        }

        body {
            font-family: 'Roboto', sans-serif; background-color: var(--gta-black);
            color: var(--text-light); margin: 0; padding: 0;
            display: flex; justify-content: center; height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent; user-select: none;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
        }

        /* HUD */
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.05); border: 2px solid #333; border-radius: 12px;
            padding: 15px 20px; margin-bottom: 20px;
        }
        .hud-left { display: flex; flex-direction: column; }
        .hud-right { text-align: right; }
        
        .hud-label { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .hud-value { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; color: var(--gta-cyan); }
        .wanted-stars { color: var(--text-dim); font-size: 18px; letter-spacing: 2px; margin-top: 4px;}
        .wanted-stars .active { color: #fff; text-shadow: 0 0 8px #fff; }

        .mission-title {
            text-align: center; font-family: 'Oswald', sans-serif; color: var(--gta-yellow); 
            font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px;
        }

        /* The Terminal (Question Box) */
        .terminal {
            background: var(--gta-dark); border: 2px solid var(--gta-cyan); border-radius: 16px;
            box-shadow: 0 0 15px rgba(15, 219, 242, 0.1); padding: 30px 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 20px; position: relative;
        }

        .intel-badge {
            position: absolute; top: -12px; background: var(--gta-cyan); color: #000;
            font-family: 'Oswald', sans-serif; font-weight: 700; padding: 4px 12px; border-radius: 8px;
            font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
        }

        .thai-meaning {
            font-size: 20px; color: var(--gta-yellow); text-align: center; font-weight: 700;
            margin-bottom: 25px; line-height: 1.4; text-shadow: 1px 1px 0 #000;
        }

        .english-template {
            font-size: 22px; font-weight: 700; text-align: center;
            line-height: 1.5; color: var(--text-light);
        }

        .blank-slot {
            display: inline-block; min-width: 100px; border-bottom: 4px solid var(--gta-pink);
            color: var(--gta-pink); text-align: center; padding: 0 10px; margin: 0 5px;
            word-wrap: break-word;
        }

        /* Options Stack (1 Column for long text) */
        .options-stack {
            display: flex; flex-direction: column; gap: 12px; margin-top: auto; overflow-y: auto;
        }
        
        .option-btn {
            background: #222; border: 2px solid #444; color: var(--text-light);
            padding: 16px 15px; border-radius: 12px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.1s; box-shadow: 0 4px 0 #111; text-align: left;
        }
        .option-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #111; }
        .option-btn.correct { background: var(--gta-green); border-color: #fff; color: #000; box-shadow: 0 4px 0 #1b8a30; }
        .option-btn.wrong { background: var(--gta-red); border-color: #fff; box-shadow: 0 4px 0 #8a1b1b; }

        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(5px);
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .passed-bg { background: rgba(0, 0, 0, 0.85); }
        .passed-text {
            font-family: 'Impact', 'Oswald', sans-serif; font-size: 48px; color: var(--gta-yellow);
            text-transform: uppercase; letter-spacing: 2px; text-align: center;
            text-shadow: 3px 3px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            transform: scale(1.5); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay.active .passed-text { transform: scale(1); }
        .xp-gain { font-family: 'Oswald', sans-serif; font-size: 24px; color: var(--gta-green); margin-top: 10px; }
        
        .wasted-bg { background: rgba(217, 65, 65, 0.4); }
        .wasted-text {
            font-family: 'Impact', 'Oswald', sans-serif; font-size: 64px; color: var(--gta-red);
            text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

    </style>
</head>
<body>

    <div class="app-container" id="main-container">
        
        <!-- HUD -->
        <div class="hud">
            <div class="hud-left">
                <span class="hud-label">Respect</span>
                <span class="hud-value" id="xp-display">0 XP</span>
            </div>
            <div class="hud-right">
                <span class="hud-label">Heat Level</span>
                <div class="wanted-stars" id="wanted-stars">☆☆☆☆☆</div>
            </div>
        </div>

        <div class="mission-title">Decrypt The Intel</div>

        <!-- Terminal (Question Board) -->
        <div class="terminal">
            <div class="intel-badge">Intercepted Target</div>
            <div class="thai-meaning" id="thai-meaning">กำลังโหลด...</div>
            <div class="english-template" id="english-template">
                [ <span class="blank-slot">_____</span> ]
            </div>
        </div>

        <!-- Options Stack (Vertical for long phrases) -->
        <div class="options-stack" id="options-grid">
            <!-- Buttons Injected via JS -->
        </div>

        <!-- Overlays -->
        <div class="overlay passed-bg" id="overlay-passed">
            <div class="passed-text">CODE CRACKED</div>
            <div class="xp-gain" id="xp-gain-text">+20 RESPECT</div>
        </div>

        <div class="overlay wasted-bg" id="overlay-wasted">
            <div class="wasted-text">WASTED</div>
            <div class="xp-gain" style="color: #fff; font-size: 18px;">Intel Lost</div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
