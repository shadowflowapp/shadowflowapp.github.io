<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Family Matrix</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --surface-color: #1a1d24;
            --surface-hover: #2a2d35;
            --text-main: #ffffff;
            --text-sub: #8a919f;
            --accent-blue: #3b82f6;
            --accent-gold: #f59e0b;
            --correct-color: #2eab5b;
            --wrong-color: #e53e3e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 0; display: flex; justify-content: center;
            height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column;
            padding: 20px 20px 30px 20px; box-sizing: border-box;
        }

        /* Top Header: Scrollable Root Words */
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .root-label { font-size: 12px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        
        .root-selector {
            display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth;
            padding: 10px 0; align-items: baseline; justify-content: flex-start;
            scrollbar-width: none; /* Firefox */
        }
        .root-selector::-webkit-scrollbar { display: none; /* Chrome */ }

        .root-pill {
            font-size: 26px; font-weight: 800; color: var(--text-sub);
            text-transform: uppercase; cursor: pointer; transition: all 0.2s ease;
            white-space: nowrap; opacity: 0.5;
        }
        .root-pill.active {
            color: var(--accent-gold); font-size: 38px; opacity: 1; letter-spacing: -1px;
        }

        /* Form Selector (Horizontal Scroll Pills) */
        .form-selector {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 5px;
            scrollbar-width: none;
        }
        .form-selector::-webkit-scrollbar { display: none; }
        
        .form-pill {
            background: var(--surface-color); color: var(--text-main); border: 2px solid transparent;
            padding: 10px 20px; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer;
            white-space: nowrap; transition: all 0.2s;
        }
        .form-pill.active { background: rgba(59, 130, 246, 0.2); border-color: var(--accent-blue); color: var(--accent-blue); }

        /* Study Area */
        .card {
            background-color: var(--surface-color); border-radius: 24px; padding: 24px;
            flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            scrollbar-width: none;
        }
        .card::-webkit-scrollbar { display: none; }
        
        .form-title-container { display: flex; align-items: center; margin-bottom: 5px; gap: 10px; }
        .form-title { font-size: 28px; font-weight: 800; color: var(--accent-blue); }
        .form-pos { font-size: 14px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .form-def { font-size: 18px; line-height: 1.5; margin-bottom: 25px; }

        .sentence-block { margin-bottom: 25px; }
        .sentence-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px;}
        .english-sentence { font-size: 20px; font-weight: 500; line-height: 1.4; }
        .thai-bridge { font-size: 15px; color: var(--accent-gold); font-weight: 500; }
        .target-highlight { color: var(--accent-blue); font-weight: 700; text-decoration: underline; }

        /* Audio Buttons */
        .icon-btn {
            background: rgba(255, 255, 255, 0.1); border: none; font-size: 18px; cursor: pointer;
            color: var(--text-main); border-radius: 50%; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: transform 0.1s, background 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.3); }

        /* Quiz Area (Hidden initially) */
        #quiz-container { display: none; flex-direction: column; flex-grow: 1; }
        .quiz-title { font-size: 16px; color: var(--accent-gold); font-weight: 800; text-transform: uppercase; text-align: center; margin-bottom: 30px; letter-spacing: 2px; }
        .quiz-sentence { font-size: 24px; font-weight: 500; line-height: 1.5; text-align: center; margin-bottom: 40px; }
        .blank { display: inline-block; min-width: 100px; border-bottom: 3px solid var(--text-sub); color: transparent; text-align: center; font-weight: 800; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option-btn { background-color: var(--surface-color); color: var(--text-main); border: 2px solid transparent; padding: 18px 10px; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.1s ease; }
        .option-btn.correct { background-color: var(--correct-color); border-color: var(--correct-color); }
        .option-btn.wrong { background-color: var(--wrong-color); border-color: var(--wrong-color); }

        /* Controls */
        .controls { display: flex; gap: 12px; margin-top: 20px; }
        .btn { border: none; border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer; padding: 20px; flex: 1; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-quiz { background-color: var(--accent-gold); color: #000; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Top Scrollable Panel for Root Words -->
        <div class="header">
            <div class="root-label">Word Families</div>
            <div class="root-selector" id="root-selector">
                <!-- Root pills injected here -->
            </div>
        </div>

        <!-- STUDY MODE -->
        <div id="study-container" style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;">
            <div class="form-selector" id="form-selector">
                <!-- Word Form Pills generated by JS -->
            </div>

            <div class="card" id="study-card">
                <div class="form-title-container" id="form-title-container">
                    <!-- Title and Audio button injected here -->
                </div>
                <div class="form-pos" id="form-pos">Noun</div>
                <div class="form-def" id="form-def">Definition</div>
                <div id="sentences-container">
                    <!-- Sentences and Audio buttons injected here -->
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-quiz" onclick="startSyntaxQuiz()">Take Syntax Quiz ⚔️</button>
            </div>
        </div>

        <!-- QUIZ MODE -->
        <div id="quiz-container">
            <div class="card" style="justify-content: flex-start; padding-top: 40px;">
                <div class="quiz-title">Grammar Boss Fight</div>
                <div class="quiz-sentence" id="quiz-sentence">Loading...</div>
                <div class="options-grid" id="options-grid"></div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
