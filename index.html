<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocab.app</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --surface-color: #1a1d24;
            --text-main: #ffffff;
            --text-sub: #8a919f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 430px; 
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px;
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        /* Top Bar */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        .streak-badge {
            background-color: var(--surface-color);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        /* Main Content Area */
        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        #english-sentence {
            font-size: 34px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        #thai-translation {
            font-size: 20px;
            color: var(--text-sub);
            font-weight: 400;
            min-height: 60px;
            line-height: 1.4;
        }

        /* Bottom Controls */
        .controls {
            padding-bottom: 20px;
        }

        button {
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.97);
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div>Vocab.app</div>
            <div class="streak-badge">
                🔥 <span id="streak-counter">0</span>
            </div>
        </div>
        
        <div class="content-area" id="content-area">
            <div id="english-sentence">Loading...</div>
            <div id="thai-translation"></div>
        </div>

        <div class="controls">
            <button onclick="loadNextSentence()">Next Sentence</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
