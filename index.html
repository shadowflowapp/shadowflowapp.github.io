<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operation: PHYSICS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Black+Ops+One&display=swap');

        :root {
            --bg-color: #0f1110;
            --hud-green: #39ff14;
            --hud-amber: #ffb000;
            --hud-red: #ff2a2a;
            --panel-bg: rgba(20, 25, 20, 0.85);
            --border-color: #334033;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-light);
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Screen Shake Animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake-effect { animation: shake 0.4s; }

        /* Blood Damage Overlay */
        .damage-overlay {
            position: fixed; inset: 0; z-index: 50; pointer-events: none;
            background: radial-gradient(circle, transparent 30%, rgba(255, 0, 0, 0.4) 80%, rgba(255, 0, 0, 0.8) 100%);
            box-shadow: inset 0 0 100px rgba(255,0,0,0.8);
            opacity: 0; transition: opacity 0.1s ease-out;
        }
        .damage-overlay.active { opacity: 1; transition: none; }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
            position: relative; z-index: 10;
        }

        /* Tactical HUD Header */
        .hud-header {
            border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hud-title {
            font-family: 'Black Ops One', cursive; color: var(--hud-amber); font-size: 20px; letter-spacing: 2px;
        }
        .armor-status {
            color: var(--hud-green); font-size: 16px; display: flex; align-items: center; gap: 5px;
        }
        .armor-plate {
            width: 15px; height: 20px; background-color: var(--hud-green);
            border: 1px solid #000; box-shadow: 0 0 5px var(--hud-green);
        }
        .armor-plate.lost { background-color: transparent; border-color: var(--hud-red); box-shadow: none; }

        /* Objective Panel */
        .objective-panel {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-left: 4px solid var(--hud-amber); padding: 15px; border-radius: 4px;
            margin-bottom: 20px; position: relative;
        }
        .obj-label { color: var(--hud-amber); font-size: 12px; letter-spacing: 1px; margin-bottom: 5px; }
        .question-text { color: #fff; font-size: 20px; line-height: 1.4; min-height: 80px; }
        
        .decode-btn {
            background: transparent; border: 1px solid var(--hud-amber); color: var(--hud-amber);
            font-family: 'Share Tech Mono', monospace; padding: 5px 10px; font-size: 12px;
            cursor: pointer; position: absolute; top: 10px; right: 10px; text-transform: uppercase;
        }
        .decode-btn:active { background: var(--hud-amber); color: #000; }

        /* 3x3 Keypad Grid */
        .keypad-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .options-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .option-btn {
            aspect-ratio: 1 / 0.8; background: rgba(0,0,0,0.6); border: 2px solid var(--border-color);
            color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 24px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.1s; border-radius: 4px; box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
        }
        .option-btn:active { background: var(--border-color); transform: scale(0.95); }
        .option-btn.correct { background: rgba(57, 255, 20, 0.2); border-color: var(--hud-green); color: var(--hud-green); box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.4); }
        .option-btn.wrong { background: rgba(255, 42, 42, 0.2); border-color: var(--hud-red); color: var(--hud-red); opacity: 0.5; }

        /* Overlays */
        .fullscreen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
            background: rgba(0,0,0,0.9);
        }
        .fullscreen-overlay.active { opacity: 1; pointer-events: auto; }

        .overlay-title { font-family: 'Black Ops One', cursive; font-size: 40px; letter-spacing: 4px; margin-bottom: 10px; }
        .text-green { color: var(--hud-green); text-shadow: 0 0 15px var(--hud-green); }
        .text-red { color: var(--hud-red); text-shadow: 0 0 15px var(--hud-red); }

        .action-btn {
            margin-top: 30px; background: transparent; border: 2px solid #fff; color: #fff;
            font-family: 'Share Tech Mono', monospace; font-size: 20px; padding: 10px 30px;
            cursor: pointer; text-transform: uppercase;
        }
        .action-btn:active { background: #fff; color: #000; }

        /* Scanline Effect */
        .scanlines {
            position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="damage-overlay" id="damage-overlay"></div>

    <div class="app-container" id="main-container">
        
        <!-- HUD Header -->
        <div class="hud-header">
            <div class="hud-title">OP: PHYSICS</div>
            <div class="armor-status" id="armor-status">
                <div class="armor-plate" id="armor-1"></div>
                <div class="armor-plate" id="armor-2"></div>
                <div class="armor-plate" id="armor-3"></div>
            </div>
        </div>

        <!-- Objective Panel -->
        <div class="objective-panel">
            <button class="decode-btn" id="decode-btn" onclick="toggleLanguage()">Decode (TH)</button>
            <div class="obj-label">CURRENT OBJECTIVE:</div>
            <div class="question-text" id="question-text">Loading intel...</div>
        </div>

        <!-- 3x3 Keypad -->
        <div class="keypad-container">
            <div class="options-grid" id="options-grid">
                <!-- Buttons injected here -->
            </div>
        </div>

        <!-- Overlays -->
        <div class="fullscreen-overlay" id="overlay-cleared">
            <div class="overlay-title text-green">TARGET ELIMINATED</div>
            <div style="color: #ccc; font-size: 18px;">Objective Complete.</div>
        </div>

        <div class="fullscreen-overlay" id="overlay-kia">
            <div class="overlay-title text-red">K.I.A.</div>
            <div style="color: #ccc; font-size: 18px;">Armor depleted. Mission Failed.</div>
            <button class="action-btn" onclick="restartGame()">Redeploy</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
