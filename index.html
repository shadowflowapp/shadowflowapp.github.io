<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocab.app</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --surface-color: #1a1d24;
            --text-main: #ffffff;
            --text-sub: #8a919f;
            --accent: #4ade80;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Mobile viewport constraint */
        .app-container {
            width: 100%;
            max-width: 430px; /* iPhone Pro Max width */
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            position: relative;
        }

        /* Top Bar */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .streak-badge {
            background-color: #2c2f36;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Content Area */
        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        #english-sentence {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .clickable-word {
            cursor: pointer;
            display: inline-block;
            margin-right: 6px;
            margin-bottom: 6px;
            border-radius: 8px;
            padding: 2px 4px;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .clickable-word:active {
            transform: scale(0.95);
        }

        /* Visual effect for the word that was clicked to arrive here */
        .highlighted-match {
            animation: pulse-glow 2s infinite;
            text-shadow: 0 0 15px currentColor;
            border-bottom: 2px solid currentColor;
        }

        @keyframes pulse-glow {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
            100% { filter: brightness(1); }
        }

        #thai-translation {
            font-size: 20px;
            color: var(--text-sub);
            font-weight: 400;
            min-height: 60px;
        }

        /* Bottom Controls */
        .controls {
            padding-bottom: 20px;
        }

        button {
            background-color: var(--surface-color);
            color: var(--text-main);
            border: 1px solid #333;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #2a2d35;
        }

        /* Notification Toast */
        #toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4757;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="toast">Word not found!</div>

        <div class="header">
            <div>Vocab.app</div>
            <div class="streak-badge">
                🔥 <span id="streak-counter">0</span>
            </div>
        </div>
        
        <div class="content-area" id="content-area">
            <div id="english-sentence">Loading...</div>
            <div id="thai-translation"></div>
        </div>

        <div class="controls">
            <button onclick="loadRandomSentence()">Skip Sentence</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
