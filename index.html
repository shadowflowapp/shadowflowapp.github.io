<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syntax Web</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            /* Dark Theme Palette */
            --bg-main: #0f172a; 
            --bg-card: #1e293b;
            --text-main: #f8fafc; 
            --text-sub: #94a3b8;
            --accent: #3b82f6; 
            --accent-hover: #2563eb;
            --success: #10b981; 
            --success-glow: rgba(16, 185, 129, 0.6);
            --border: #334155;
            --chunk-bg: #334155;
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-main);
            color: var(--text-main); margin: 0; padding: 0;
            display: flex; justify-content: center; height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%;
            display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
        }

        /* Top HUD */
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-card); border-radius: 16px; padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .bubble-indicator { font-size: 13px; font-weight: 600; color: var(--text-sub); }
        .current-bubble { color: var(--accent); font-weight: 800; font-size: 16px; display: block; margin-top: 4px; text-transform: uppercase;}
        
        /* Interactive Stage */
        .stage {
            flex-grow: 1; display: flex; flex-direction: column;
        }

        .mission-card {
            background: var(--bg-card); border-radius: 20px; padding: 25px 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3); border: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            margin-bottom: 20px; position: relative;
        }

        .thai-text { font-size: 22px; font-weight: 700; color: var(--text-main); margin-bottom: 20px; line-height: 1.4; }
        
        .audio-btn {
            background: var(--accent); color: white; border: none;
            width: 50px; height: 50px; border-radius: 25px; font-size: 20px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
            margin-bottom: 20px; transition: transform 0.1s;
        }
        .audio-btn:active { transform: scale(0.95); }

        /* Drop Zone (Built Sentence) */
        .drop-zone {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
            min-height: 60px; width: 100%; border-bottom: 2px dashed var(--border);
            padding-bottom: 20px; margin-bottom: 20px; transition: border-color 0.3s;
        }

        /* Scrambled Bank */
        .word-bank {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%;
        }

        /* Chunks - Mobile Optimized Touch Targets */
        .chunk {
            background: var(--chunk-bg); border: 2px solid var(--border); color: var(--text-main);
            padding: 14px 20px; border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 0 var(--border);
        }
        .chunk:active { transform: translateY(4px); box-shadow: 0 0 0 var(--border); }
        
        .chunk.in-zone { background: transparent; border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); color: var(--accent); }
        .chunk.hidden { visibility: hidden; position: absolute; pointer-events: none; }
        
        /* Post-Win State (The Web) */
        .chunk.solved {
            background: var(--success); border-color: var(--success); color: #fff;
            box-shadow: 0 4px 0 #047857; transform: none; cursor: pointer;
        }
        .chunk.solved:active { transform: scale(0.95); box-shadow: 0 0 0 #047857; }

        /* Pulsating Portal Effect for Chunks with Multiple Sentences */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 var(--success-glow), 0 4px 0 #047857; }
            50% { box-shadow: 0 0 15px 5px var(--success-glow), 0 4px 0 #047857; }
            100% { box-shadow: 0 0 0 0 var(--success-glow), 0 4px 0 #047857; }
        }
        
        .chunk.solved.has-bubble {
            animation: pulseGlow 1.5s infinite ease-in-out;
            border-color: #34d399; /* Slightly brighter green border to pop */
        }
        
        .web-hint {
            font-size: 15px; color: var(--success); font-weight: 600; margin-top: 20px;
            display: none; animation: fadeIn 0.5s;
        }

        .next-btn {
            background: var(--accent); color: #fff; border: none;
            padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 800;
            cursor: pointer; margin-top: auto; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
            text-transform: uppercase; display: none; transition: transform 0.1s;
        }
        .next-btn:active { transform: scale(0.98); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HUD -->
        <div class="hud">
            <div>
                <span class="bubble-indicator">Current Bubble:</span>
                <span class="current-bubble" id="current-bubble">"LOADING..."</span>
            </div>
            <div style="text-align: right;">
                <span class="bubble-indicator">Connections:</span>
                <span class="current-bubble" id="bubble-count" style="color: var(--text-main);">0</span>
            </div>
        </div>

        <!-- Stage -->
        <div class="stage">
            <div class="mission-card">
                <div class="thai-text" id="thai-text">กำลังโหลด...</div>
                <button class="audio-btn" onclick="playAudio()">🔊</button>
                
                <div class="drop-zone" id="drop-zone"></div>
                <div class="word-bank" id="word-bank"></div>

                <div class="web-hint" id="web-hint">Tap a glowing chunk to explore its bubble!</div>
            </div>

            <button class="next-btn" id="next-btn" onclick="loadSentenceInBubble()">Next in Bubble ➔</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
