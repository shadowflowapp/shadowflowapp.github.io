<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dictionary Pronunciation App</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --app-bg: #1a1a1a;
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
      --accent: #4a90e2;
      --border: #333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* Prevents pull-to-refresh on mobile */
      overscroll-behavior-y: none; 
    }

    /* Mobile viewport enforcement on PC */
    #app-container {
      width: 100%;
      max-width: 420px; /* Mobile width */
      height: 100vh;
      max-height: 900px;
      background-color: var(--app-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* A-Z Horizontal Scroll */
    #alphabet-nav {
      display: flex;
      overflow-x: auto;
      background: var(--app-bg);
      padding: 15px 10px;
      border-bottom: 1px solid var(--border);
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    
    #alphabet-nav::-webkit-scrollbar { display: none; }
    
    .letter-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 5px 12px;
      margin: 0 5px;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .letter-btn.active {
      color: var(--text-main);
      background: var(--accent);
      font-weight: bold;
    }

    /* Main Content Area */
    #content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    #word-display {
      /* Responsive sizing to prevent cutoff */
      font-size: clamp(2rem, 10vw, 3.5rem); 
      font-weight: 700;
      margin-bottom: 10px;
      word-break: break-word;
      line-height: 1.1;
    }

    #pos-display {
      font-size: 1rem;
      color: var(--accent);
      font-style: italic;
      margin-bottom: 30px;
      text-transform: lowercase;
    }

    #sentence-display {
      font-size: 1.2rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 40px;
    }

    #play-audio-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-bottom: 40px;
    }

    #play-audio-btn:active { transform: scale(0.95); }

    /* Controls (Slider & Prev/Next) */
    #controls {
      padding: 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-color);
    }

    #slider-container {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #word-slider {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .slider-label { font-size: 0.8rem; color: var(--text-muted); width: 40px; text-align: center; }

    #nav-buttons {
      display: flex;
      justify-content: space-between;
    }

    .nav-btn {
      background: #333;
      color: var(--text-main);
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      flex: 0.48;
    }
    
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="alphabet-nav"></div>

    <div id="content-area">
      <div id="word-display">Loading...</div>
      <div id="pos-display">-</div>
      <button id="play-audio-btn">🔊</button>
      <div id="sentence-display">Please wait while the dictionary loads.</div>
    </div>

    <div id="controls">
      <div id="slider-container">
        <span class="slider-label" id="slider-current">1</span>
        <input type="range" id="word-slider" min="0" max="0" value="0">
        <span class="slider-label" id="slider-total">1</span>
      </div>
      <div id="nav-buttons">
        <button id="prev-btn" class="nav-btn">← Prev</button>
        <button id="next-btn" class="nav-btn">Next →</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
