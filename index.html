<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SwipeLingo TH — Gamified English Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-outer: #05070e;
      --bg-app: #0c111d;
      --bg-panel: #141c2f;
      --bg-card: linear-gradient(160deg, #1b2540 0%, #121829 100%);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #f43f5e;
      --accent-gold: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-violet: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Outfit', 'Kanit', sans-serif;
      background: radial-gradient(circle at top, #151e38 0%, var(--bg-outer) 70%);
      color: var(--text-main);
      height: 100dvh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Mobile-first vertical frame; enforces phone aspect ratio on PC */
    .phone-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 480px) {
      .phone-shell {
        width: 410px;
        height: min(92dvh, 840px);
        border-radius: 36px;
        border: 8px solid #1e293b;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 30px 70px rgba(0, 0, 0, 0.75);
      }
    }

    /* Top AAA Game HUD */
    .hud {
      padding: 16px 18px 12px;
      background: rgba(20, 28, 47, 0.85);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .player-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 10px 4px 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      transition: background 0.2s;
    }

    .player-badge:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .lvl-hex {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-gold), #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: #0b0f19;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
    }

    .rank-info {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .rank-title {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .xp-text {
      font-size: 0.82rem;
      color: var(--text-main);
      font-weight: 600;
    }

    .hud-stats {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .stat-pill.streak {
      color: #fb923c;
      border-color: rgba(251, 146, 60, 0.35);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.15s, background 0.15s;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .xp-bar-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .xp-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet), var(--accent-gold));
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Card Arena */
    .arena {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow: hidden;
    }

    .card-stack-bg {
      position: absolute;
      width: calc(100% - 52px);
      height: calc(100% - 48px);
      max-height: 460px;
      border-radius: 26px;
      background: rgba(27, 37, 64, 0.45);
      border: 1px solid var(--border-subtle);
      transform: scale(0.94) translateY(14px);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 460px;
      border-radius: 26px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      touch-action: none;
      cursor: grab;
      will-change: transform;
      z-index: 2;
    }

    .card:active {
      cursor: grabbing;
    }

    .card.audio-mode {
      border-color: rgba(6, 182, 212, 0.45);
      box-shadow: 0 20px 45px rgba(6, 182, 212, 0.15);
    }

    /* Swipe Stamps */
    .stamp {
      position: absolute;
      top: 26px;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 0.1em;
      border: 3px solid;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    .stamp.match {
      left: 20px;
      color: var(--accent-green);
      border-color: var(--accent-green);
      transform: rotate(-14deg);
      background: rgba(16, 185, 129, 0.12);
    }

    .stamp.nope {
      right: 20px;
      color: var(--accent-red);
      border-color: var(--accent-red);
      transform: rotate(14deg);
      background: rgba(244, 63, 94, 0.12);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-muted);
    }

    .tag.listening {
      background: rgba(6, 182, 212, 0.18);
      color: #22d3ee;
      border: 1px solid rgba(34, 211, 238, 0.35);
    }

    .xp-reward-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .english-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 4px;
      gap: 14px;
    }

    .english-phrase {
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.28;
      color: #ffffff;
    }

    .mini-audio-row {
      display: flex;
      gap: 8px;
    }

    .audio-pill-btn {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.15s;
    }

    .audio-pill-btn:active {
      transform: scale(0.95);
    }

    /* Audio-Only Listening Challenge Button */
    .big-audio-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      color: white;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.55);
      animation: pulseGlow 2s infinite;
      transition: transform 0.15s;
    }

    .big-audio-btn:active {
      transform: scale(0.93);
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.55); }
      70% { box-shadow: 0 0 0 18px rgba(6, 182, 212, 0); }
      100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
    }

    .listen-hint {
      font-size: 0.85rem;
      color: #67e8f9;
      font-weight: 500;
    }

    .divider {
      height: 1px;
      width: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
      margin: 8px 0;
    }

    .thai-zone {
      padding: 14px 6px 6px;
      text-align: center;
    }

    .thai-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .thai-meaning {
      font-family: 'Kanit', sans-serif;
      font-size: 1.45rem;
      font-weight: 500;
      line-height: 1.35;
      color: #e2e8f0;
    }

    /* Bottom Action Controls */
    .controls {
      padding: 10px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
    }

    .action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid;
      background: var(--bg-panel);
      font-size: 1.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .action-btn.nope {
      color: var(--accent-red);
      border-color: rgba(244, 63, 94, 0.45);
      box-shadow: 0 8px 20px rgba(244, 63, 94, 0.18);
    }

    .action-btn.match {
      color: var(--accent-green);
      border-color: rgba(16, 185, 129, 0.45);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.18);
    }

    .action-btn.replay {
      width: 48px;
      height: 48px;
      font-size: 1.15rem;
      color: var(--accent-cyan);
      border-color: rgba(6, 182, 212, 0.4);
    }

    .hint-bar {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    /* Feedback Toast */
    .toast {
      position: absolute;
      bottom: 112px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: calc(100% - 36px);
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--border-subtle);
      font-family: 'Kanit', 'Outfit', sans-serif;
      font-size: 0.86rem;
      line-height: 1.35;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.correct {
      border-color: rgba(16, 185, 129, 0.6);
      color: #a7f3d0;
    }

    .toast.wrong {
      border-color: rgba(244, 63, 94, 0.6);
      color: #fecdd3;
    }

    /* Floating XP Pop */
    .xp-pop {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent-gold);
      text-shadow: 0 2px 12px rgba(245, 158, 11, 0.6);
      pointer-events: none;
      z-index: 30;
      animation: floatUp 0.9s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.9); }
      100% { opacity: 0; transform: translate(-50%, -65px) scale(1.15); }
    }

    /* Dashboard Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 14, 0.82);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .dashboard-sheet {
      width: 100%;
      max-height: 84%;
      background: #111827;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-header h2 {
      font-size: 1.15rem;
      letter-spacing: 0.03em;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px;
    }

    .stat-box .label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-box .value {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .mistakes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mistake-item {
      background: rgba(244, 63, 94, 0.08);
      border: 1px solid rgba(244, 63, 94, 0.22);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.85rem;
    }

    .mistake-item .en {
      font-weight: 700;
      color: #fff;
    }

    .mistake-item .th {
      font-family: 'Kanit', sans-serif;
      color: #a7f3d0;
      margin-top: 2px;
    }

    .reset-btn {
      padding: 11px;
      border-radius: 12px;
      border: 1px solid rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.12);
      color: #fda4af;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <!-- AAA Game HUD -->
    <header class="hud">
      <div class="hud-top">
        <div class="player-badge" id="openDashboardBtn" title="Open Player Dashboard">
          <div class="lvl-hex" id="hudLevel">1</div>
          <div class="rank-info">
            <span class="rank-title" id="hudRank">ROOKIE</span>
            <span class="xp-text" id="hudXp">0 / 100 XP</span>
          </div>
        </div>

        <div class="hud-stats">
          <div class="stat-pill streak" id="hudStreak">🔥 0</div>
          <button class="icon-btn" id="soundToggleBtn" title="Toggle Sound Effects">🔊</button>
          <button class="icon-btn" id="statsBtn" title="Dashboard">📊</button>
        </div>
      </div>
      <div class="xp-bar-track">
        <div class="xp-bar-fill" id="xpBarFill"></div>
      </div>
    </header>

    <!-- Swipe Card Arena -->
    <main class="arena" id="arena">
      <div class="card-stack-bg"></div>
      <div id="cardMount" style="width:100%; height:100%; max-height:460px; display:flex; align-items:center; justify-content:center;"></div>
    </main>

    <!-- Instant Learning Toast -->
    <div class="toast" id="feedbackToast"></div>

    <!-- Bottom Controls -->
    <footer class="controls">
      <div class="btn-row">
        <button class="action-btn nope" id="btnNope" aria-label="Not Match">✕</button>
        <button class="action-btn replay" id="btnReplay" aria-label="Play Audio">🔊</button>
        <button class="action-btn match" id="btnMatch" aria-label="Match">✓</button>
      </div>
      <div class="hint-bar">Swipe Left (Wrong) • Swipe Right (Match) • Keys: ← / → / Space</div>
    </footer>

    <!-- Player Dashboard Modal -->
    <div class="modal-backdrop" id="dashboardModal">
      <div class="dashboard-sheet">
        <div class="sheet-header">
          <h2>🏆 Player Dashboard</h2>
          <button class="icon-btn" id="closeDashboardBtn">✕</button>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="label">Total XP</div>
            <div class="value" id="statTotalXp" style="color: var(--accent-gold);">0</div>
          </div>
          <div class="stat-box">
            <div class="label">Accuracy</div>
            <div class="value" id="statAccuracy" style="color: var(--accent-green);">0%</div>
          </div>
          <div class="stat-box">
            <div class="label">Best Streak</div>
            <div class="value" id="statBestStreak" style="color: #fb923c;">0</div>
          </div>
          <div class="stat-box">
            <div class="label">Listening Skill</div>
            <div class="value" id="statListening" style="color: var(--accent-cyan);">0%</div>
          </div>
        </div>

        <div>
          <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.06em;">
            Recent Mistakes to Review
          </div>
          <div class="mistakes-list" id="mistakesList"></div>
        </div>

        <button class="reset-btn" id="resetProgressBtn">Reset Progress</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
