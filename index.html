<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dictionary Challenge</title>
    <!-- Confetti Library for Mr. Beast vibes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* PC Background */
        body { 
            background-color: #0a0a0a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        /* Mobile Viewport Lock */
        #app-container {
            width: 100%;
            max-width: 400px; /* Locks width for PC */
            height: 100vh;
            max-height: 850px; /* Locks height for PC */
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 12px;
        }
        
        /* Remove border radius on actual mobile */
        @media (max-width: 400px) {
            #app-container { max-height: 100vh; border-radius: 0; }
        }

        #header { padding: 20px; font-size: 1.2rem; font-weight: bold; background: #1f1f1f; border-bottom: 2px solid #ffcc00; text-align: center; z-index: 10; }
        .score-highlight { color: #ffcc00; font-size: 1.5rem; }
        
        /* Normal Flashcard UI */
        #flashcard { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        #word { font-size: 3.5rem; font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; text-transform: capitalize; }
        #pos { font-size: 1.5rem; color: #ff5555; margin-bottom: 20px; font-style: italic; }
        #thai { font-size: 2.5rem; color: #4CAF50; margin-bottom: 40px; }
        
        .btn { padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.95); }
        
        #audio-btn { background: #0088ff; color: white; margin-bottom: 40px; border-radius: 50%; width: 70px; height: 70px; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; }
        
        #controls { display: flex; justify-content: space-between; padding: 20px; background: #1f1f1f; z-index: 10; }
        #back-btn { background: #333; color: white; width: 45%; }
        #next-btn { background: #ffcc00; color: #000; width: 45%; }
        
        /* DEATHRUN QUIZ UI */
        #quiz-container { 
            display: none; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #990000; 
            flex-direction: column; justify-content: center; align-items: center; 
            padding: 20px; text-align: center; z-index: 20;
        }
        
        .timer { font-size: 4rem; font-weight: 900; color: #ffcc00; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
        .death-title { font-size: 2rem; color: white; font-weight: 900; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; animation: pulse 0.5s infinite alternate; }
        #quiz-word { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; color: white; }
        
        .quiz-option { 
            background: #ffffff; color: #000; margin: 10px 0; padding: 15px; width: 100%; 
            border-radius: 10px; font-size: 1.4rem; font-weight: bold; border: none; cursor: pointer;
            box-shadow: 0 4px 0 #cccccc;
        }
        .quiz-option:active { transform: translateY(4px); box-shadow: none; }

        /* Animations */
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.3s; animation-iteration-count: infinite; }

        /* Dim flashcard when loading */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="header">
        Words Conquered: <span id="score" class="score-highlight">0</span>
    </div>

    <!-- Main Flashcard -->
    <div id="flashcard">
        <div id="word">Loading...</div>
        <div id="pos">...</div>
        <button id="audio-btn" class="btn" onclick="playAudio()">🔊</button>
        <div id="thai">...</div>
    </div>

    <!-- Deathrun Container -->
    <div id="quiz-container">
        <div class="death-title">☠️ DEATHRUN ☠️</div>
        <div id="timer" class="timer">10.0</div>
        <div style="color: white; margin-bottom: 5px;">Match 3 words to survive!</div>
        <div style="font-size: 1.2rem; color: #ffcc00; margin-bottom: 20px;">Progress: <span id="quiz-progress">1/3</span></div>
        <div id="quiz-word">...</div>
        <div id="quiz-options" style="width: 100%;"></div>
    </div>

    <div id="controls">
        <button id="back-btn" class="btn" onclick="prevWord()">BACK</button>
        <button id="next-btn" class="btn" onclick="nextWord()">NEXT 🔥</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
