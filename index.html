<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>San Andreas Polyglot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700;900&display=swap');

        :root {
            --gta-black: #0a0a0a; --gta-dark: #1c1c1e;
            --gta-green: #41d95d; --gta-red: #d94141;
            --gta-yellow: #f2c80f; --gta-cyan: #0fdbf2; --gta-pink: #f20f8c;
            --text-light: #f5f5f5; --text-dim: #888888;
        }

        body {
            font-family: 'Roboto', sans-serif; background-color: var(--gta-black);
            color: var(--text-light); margin: 0; padding: 0;
            display: flex; justify-content: center; height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; position: relative;
        }

        /* HUD Header */
        .hud { margin-bottom: 15px; border-bottom: 2px solid #333; padding-bottom: 15px; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
        
        .rank-title { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; color: var(--gta-yellow); text-transform: uppercase; text-shadow: 1px 1px 0px #000; }
        .cefr-badge { font-size: 14px; background: var(--gta-cyan); color: #000; font-weight: 900; padding: 2px 6px; border-radius: 4px; margin-left: 8px;}
        
        .wanted-stars { color: var(--text-dim); font-size: 20px; letter-spacing: 2px; }
        .wanted-stars .active { color: #fff; text-shadow: 0 0 8px #fff; }

        .xp-bar-bg { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        .xp-bar-fill { height: 100%; background: var(--gta-pink); width: 0%; transition: width 0.3s ease; }
        .xp-text { font-size: 12px; color: var(--text-dim); text-align: right; margin-top: 4px; font-weight: 700; text-transform: uppercase;}

        /* The Recon Stage (Study) */
        .card {
            background-color: rgba(255,255,255,0.05); border: 2px solid #333;
            border-radius: 16px; padding: 20px; flex-grow: 1; display: flex; flex-direction: column;
            overflow-y: auto; text-align: center; position: relative;
        }

        .card-image {
            width: 100%; height: 160px; object-fit: cover; border-radius: 8px; 
            border: 2px solid #444; margin-bottom: 15px; background-color: #222;
        }

        .word-header { margin-bottom: 10px; }
        .target-word { font-family: 'Oswald', sans-serif; font-size: 42px; color: var(--gta-cyan); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}
        .phonetic { font-size: 16px; color: var(--text-dim); margin-bottom: 5px; font-family: monospace; }
        .pos-badge { display: inline-block; border: 1px solid var(--text-dim); color: var(--text-dim); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; }

        .translation { font-size: 20px; font-weight: 900; color: var(--gta-yellow); margin: 10px 0; }
        .definition { font-size: 14px; color: #ccc; margin-bottom: 15px; font-style: italic;}
        
        .sentence-box {
            background: rgba(0,0,0,0.5); border-left: 4px solid var(--gta-pink);
            padding: 15px; border-radius: 0 8px 8px 0; font-size: 18px; font-weight: 500; color: var(--text-light); margin-bottom: 15px; text-align: left;
        }

        .audio-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .audio-btn {
            background: transparent; border: 2px solid #555; color: #fff; 
            font-size: 14px; font-weight: 900; padding: 10px 15px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 5px; flex: 1; justify-content: center; text-transform: uppercase;
        }
        .audio-btn:active { background: #333; }

        .action-btn {
            background: var(--gta-pink); border: none; color: #fff; 
            font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; padding: 15px; 
            border-radius: 8px; cursor: pointer; margin-top: auto; text-transform: uppercase; letter-spacing: 1px;
        }
        .action-btn:active { transform: scale(0.98); }

        /* The Heist Mode (Quiz) */
        #heist-mode { display: none; }
        .heist-title { font-family: 'Oswald', sans-serif; font-size: 22px; color: var(--gta-red); margin-bottom: 15px; letter-spacing: 2px; text-transform: uppercase;}
        .blank-sentence { font-size: 22px; font-weight: 500; margin-bottom: 25px; line-height: 1.5; text-align: left;}
        .blank { display: inline-block; min-width: 80px; border-bottom: 4px solid var(--gta-cyan); color: transparent; }

        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .option-btn {
            background: var(--gta-dark); color: #fff; border: 2px solid #444;
            padding: 18px 10px; border-radius: 8px; font-size: 18px; font-weight: 700; text-transform: lowercase;
            cursor: pointer; transition: all 0.1s; text-align: center;
        }
        .option-btn:active { background: #333; }
        .option-btn.correct { background: var(--gta-green); color: #000; border-color: var(--gta-green); }
        .option-btn.wrong { background: var(--gta-red); color: #fff; border-color: var(--gta-red); }

        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(5px);
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .passed-bg { background: rgba(0, 0, 0, 0.85); }
        .passed-text {
            font-family: 'Impact', 'Oswald', sans-serif; font-size: 48px; color: var(--gta-yellow);
            text-transform: uppercase; letter-spacing: 2px; text-align: center;
            text-shadow: 3px 3px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            transform: scale(1.5); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay.active .passed-text { transform: scale(1); }
        .xp-gain { font-family: 'Oswald', sans-serif; font-size: 24px; color: var(--gta-green); margin-top: 10px; }
        
        .wasted-bg { background: rgba(217, 65, 65, 0.4); }
        .wasted-text {
            font-family: 'Impact', 'Oswald', sans-serif; font-size: 64px; color: var(--gta-red);
            text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HUD -->
        <div class="hud">
            <div class="hud-top">
                <div>
                    <span class="rank-title" id="rank-title">Street Thug</span>
                    <span class="cefr-badge" id="cefr-badge">A1</span>
                </div>
                <div class="wanted-stars" id="wanted-stars">☆☆☆☆☆</div>
            </div>
            <div>
                <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
                <div class="xp-text">Respect: <span id="xp-display">0</span> XP</div>
            </div>
        </div>

        <!-- RECON MODE (Study) -->
        <div class="card" id="recon-mode">
            <img class="card-image" id="study-image" src="" alt="Intel Image">
            
            <div class="word-header">
                <div class="target-word" id="target-word">loading</div>
                <div class="phonetic" id="phonetic"></div>
                <div class="pos-badge" id="pos"></div>
            </div>

            <div class="translation" id="translation"></div>
            <div class="definition" id="definition"></div>
            
            <div class="sentence-box" id="study-sentence"></div>

            <div class="audio-controls">
                <button class="audio-btn" onclick="playWord()">🔊 Word</button>
                <button class="audio-btn" onclick="playSentence()">🗣️ Audio Log</button>
            </div>

            <button class="action-btn" onclick="startHeist()">Execute Heist</button>
        </div>

        <!-- HEIST MODE (Quiz) -->
        <div class="card" id="heist-mode">
            <div class="heist-title">Target Acquired</div>
            <img class="card-image" id="quiz-image" src="" alt="Heist Target">
            
            <div class="blank-sentence" id="quiz-sentence"></div>

            <div class="options-grid" id="options-grid"></div>
        </div>

        <!-- OVERLAYS -->
        <div class="overlay passed-bg" id="overlay-passed">
            <div class="passed-text">MISSION PASSED</div>
            <div class="xp-gain" id="xp-gain-text">+20 RESPECT</div>
        </div>

        <div class="overlay wasted-bg" id="overlay-wasted">
            <div class="wasted-text">WASTED</div>
            <div class="xp-gain" style="color: #fff; font-size: 18px;">-10 RESPECT</div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
