<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Ascension</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --surface-color: #1a1d24;
            --surface-hover: #2a2d35;
            --text-main: #ffffff;
            --text-sub: #8a919f;
            --correct-color: #2eab5b;
            --wrong-color: #e53e3e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            height: 100vh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%; max-width: 430px; height: 100%;
            display: flex; flex-direction: column;
            padding: 40px 24px; box-sizing: border-box;
            position: relative;
        }

        /* Top HUD */
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .progress-badge { font-size: 16px; font-weight: 700; background: var(--surface-color); padding: 8px 16px; border-radius: 20px; }
        .hearts { font-size: 20px; letter-spacing: 2px; color: #ff4757; }

        /* Level Tag */
        .level-tag-container { margin-bottom: 20px; }
        #level-tag {
            display: inline-block; padding: 4px 10px; border-radius: 6px;
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #fff;
        }

        /* Question Area */
        .question-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #math-problem { font-size: 38px; font-weight: 700; line-height: 1.4; margin-bottom: 40px; }

        /* Options Grid */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 20px; }
        .option-btn { background-color: var(--surface-color); color: var(--text-main); border: 2px solid transparent; padding: 20px 10px; border-radius: 16px; font-size: 22px; font-weight: 600; cursor: pointer; transition: all 0.1s ease; }
        .option-btn:active { transform: scale(0.95); background-color: var(--surface-hover); }
        .option-btn.correct { background-color: var(--correct-color); border-color: var(--correct-color); }
        .option-btn.wrong { background-color: var(--wrong-color); border-color: var(--wrong-color); }

        /* Explanation Box */
        .feedback-area { display: none; flex-direction: column; padding-bottom: 20px; }
        .explanation-box { background-color: rgba(229, 62, 62, 0.1); border-left: 4px solid var(--wrong-color); padding: 16px; border-radius: 0 8px 8px 0; margin-bottom: 16px; }
        .explanation-title { font-size: 14px; font-weight: 700; color: var(--wrong-color); margin-bottom: 6px; text-transform: uppercase; }
        .explanation-text { font-size: 15px; color: var(--text-main); line-height: 1.5; }
        .continue-btn { background-color: var(--text-main); color: var(--bg-color); border: none; padding: 18px; border-radius: 16px; font-size: 17px; font-weight: 700; cursor: pointer; width: 100%; }

        /* Game Over / Victory Overlay */
        #game-over {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(13, 15, 18, 0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center;
        }
        #game-over h1 { font-size: 36px; margin-bottom: 10px; }
        #game-over p { font-size: 20px; color: var(--text-sub); margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="hud">
            <div class="progress-badge">Q: <span id="q-counter">1</span> / <span id="q-total">100</span></div>
            <div class="hearts" id="hearts">❤️❤️❤️</div>
        </div>

        <div class="level-tag-container">
            <span id="level-tag">Loading...</span>
        </div>
        
        <div class="question-area">
            <div id="math-problem"></div>
        </div>

        <div class="options-grid" id="options-grid"></div>

        <div class="feedback-area" id="feedback-area">
            <div class="explanation-box">
                <div class="explanation-title">Explanation</div>
                <div class="explanation-text" id="explanation-text"></div>
            </div>
            <button class="continue-btn" onclick="handleContinue()">Next Question</button>
        </div>

        <!-- End Screen -->
        <div id="game-over">
            <h1 id="end-title">Game Over</h1>
            <p>You reached Level: <span id="final-score">1</span></p>
            <button class="continue-btn" style="width: auto; padding: 16px 32px;" onclick="startGame()">Try Again</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
