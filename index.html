<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syntax Web</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-main: #E0E0E0;
            --text-muted: #888888;
            --accent: #00E5FF;
            --success: #00C853;
            --border: #333333;
            --chunk-bg: #2C2C2C;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; justify-content: center;
            height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%;
            display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box;
        }

        /* Minimalist HUD */
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 5px; margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .bubble-info { display: flex; flex-direction: column; }
        .bubble-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .bubble-target { font-size: 16px; font-weight: 700; color: var(--accent); margin-top: 4px; }
        .progress-counter { font-size: 14px; color: var(--text-muted); font-weight: 500; }

        /* Stage and Swipe Area */
        .stage {
            flex-grow: 1; display: flex; flex-direction: column;
            position: relative; touch-action: pan-y; /* Allows swipe detection */
        }

        .mission-card {
            background: var(--card-bg); border-radius: 16px; padding: 30px 20px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid var(--border);
            transition: opacity 0.2s ease, transform 0.2s ease; flex-grow: 1; margin-bottom: 20px;
        }

        .thai-text { font-size: 20px; font-weight: 600; color: var(--text-main); margin-bottom: 30px; line-height: 1.5; }
        
        .audio-btn {
            background: transparent; color: var(--text-muted); border: 1px solid var(--border);
            width: 44px; height: 44px; border-radius: 22px; font-size: 18px;
            cursor: pointer; margin-bottom: 25px; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .audio-btn:active { background: #333; color: var(--text-main); }

        /* Drop Zone */
        .drop-zone {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
            min-height: 60px; width: 100%; border-bottom: 1px solid var(--border);
            padding-bottom: 25px; margin-bottom: 25px;
        }

        /* Word Bank */
        .word-bank {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%;
        }

        /* Chunks */
        .chunk {
            background: var(--chunk-bg); border: 1px solid var(--border); color: var(--text-main);
            padding: 12px 16px; border-radius: 8px; font-size: 16px; font-weight: 500;
            cursor: pointer; transition: all 0.15s ease;
        }
        .chunk:active { transform: scale(0.95); background: #3a3a3a; }
        
        .chunk.in-zone { background: transparent; border-color: var(--accent); color: var(--accent); }
        .chunk.hidden { visibility: hidden; position: absolute; pointer-events: none; }
        
        /* Post-Win State */
        .chunk.solved {
            background: rgba(0, 200, 83, 0.1); border-color: var(--success); color: var(--success);
            cursor: pointer;
        }
        .chunk.solved:active { transform: scale(0.95); }
        
        .web-hint {
            font-size: 13px; color: var(--success); font-weight: 500; margin-top: 20px;
            display: none; animation: fadeIn 0.4s;
        }

        .swipe-hint {
            font-size: 12px; color: var(--text-muted); text-align: center;
            margin-top: auto; padding-top: 15px; letter-spacing: 0.5px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HUD -->
        <div class="hud">
            <div class="bubble-info">
                <span class="bubble-label">Current Node</span>
                <span class="bubble-target" id="current-bubble">"..."</span>
            </div>
            <div class="progress-counter" id="progress-counter">0 / 0</div>
        </div>

        <!-- Stage -->
        <div class="stage" id="swipe-stage">
            <div class="mission-card" id="mission-card">
                <button class="audio-btn" onclick="playAudio()">🔊</button>
                <div class="thai-text" id="thai-text">Loading...</div>
                
                <div class="drop-zone" id="drop-zone"></div>
                <div class="word-bank" id="word-bank"></div>

                <div class="web-hint" id="web-hint">Tap any chunk to explore its network</div>
                <div class="swipe-hint">Swipe ← Next | Prev →</div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
